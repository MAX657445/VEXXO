name: keepalive
# Раз в два дня стучимся в Supabase, чтобы бесплатный проект не уснул. Используется только публичный ключ.
on:
  schedule:
    - cron: '17 6 */2 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -fsS -X POST 'https://cnkergfsrmvvvbsubqnv.supabase.co/rest/v1/rpc/vx_ping' \
            -H 'apikey: sb_publishable_y_PN61X0Fnrupm3tuKU5sQ_uStCwgok' \
            -H 'Content-Type: application/json' -d '{}'
