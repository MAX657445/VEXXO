<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VEXXO</title>
<meta name="theme-color" content="#181818">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="VEXXO">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Раскладка: слева меню (на телефоне нижняя панель), сверху поиск, в центре раздел, справа сворачиваемый помощник.
   Тёмный графит, карточки чуть светлее фона, один мягкий сине-фиолетовый акцент, единый радиус. */
:root {
  --bg: #0A0A0A;
  --side: #000000;
  --surface: #141414;
  --surface-2: #1E1E1E;
  --line: #333333;
  --ink: #F5F5F5;
  --muted: #A3A3A3;
  --accent: #FFFFFF;
  --accent-soft: rgba(255, 255, 255, .12);
  --on-accent: #000000;
  --ok: #E5E5E5;
  --bad: #FFFFFF;
  --warn: #BDBDBD;
  --r: 12px;
  --pad: 16px;
  --font-sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #F2F2F2; --side: #FFFFFF; --surface: #FFFFFF; --surface-2: #EEEEEE; --line: #DDDDDD; --ink: #181818; --muted: #656565;
  --accent: #696969; --accent-soft: rgba(105, 105, 105, .12); --on-accent: #FFFFFF; --ok: #505050; --bad: #4D4D4D; --warn: #676767; color-scheme: light;
}
@media (prefers-color-scheme: light) {
  :root[data-theme="auto"] {
    --bg: #F2F2F2; --side: #FFFFFF; --surface: #FFFFFF; --surface-2: #EEEEEE; --line: #DDDDDD; --ink: #181818; --muted: #656565;
    --accent: #696969; --accent-soft: rgba(105, 105, 105, .12); --on-accent: #FFFFFF; --ok: #505050; --bad: #4D4D4D; --warn: #676767; color-scheme: light;
  }
}
:root[data-density="compact"] { --pad: 11px; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-sans); font-size: 15px; line-height: 1.5; min-height: 100vh; }
button, input, select, textarea { font: inherit; color: inherit; }
input, select, textarea { font-size: 16px; }
button { cursor: pointer; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, h4, p { margin: 0; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.ic { width: 20px; height: 20px; flex: none; }
.ic.s { width: 16px; height: 16px; }

/* ---------- Вход ---------- */
.lock { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: radial-gradient(900px 500px at 50% -10%, rgba(162, 162, 162, .16), transparent 60%), var(--bg); }
.lock-card { width: min(380px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 28px 22px 24px; display: flex; flex-direction: column; gap: 18px; align-items: center; text-align: center; }
.brand { display: flex; align-items: center; gap: 12px; text-align: left; }
.brand-ic { width: 44px; height: 44px; border-radius: var(--r); background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex: none; }
.brand-ic .ic { width: 24px; height: 24px; }
.brand-n { font-weight: 700; font-size: 20px; letter-spacing: .08em; line-height: 1.1; }
.brand-s { color: var(--muted); font-size: 13px; }
.lock-t { color: var(--muted); font-size: 14px; }
.dots { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; row-gap: 8px; min-height: 16px; }
.dots i { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--muted); transition: background-color .12s; }
.dots i.on { background: var(--accent); border-color: var(--accent); }
.dots.bad { animation: shake .35s; }
.dots.bad i { border-color: var(--bad); }
@keyframes shake { 20%, 60% { transform: translateX(-7px); } 40%, 80% { transform: translateX(7px); } }
.keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; }
.keys button { height: 56px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface-2); font-size: 20px; font-weight: 500; }
.keys button:hover { border-color: var(--accent); }
.keys button:active { background: var(--accent-soft); }
.keys .ok { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-size: 15px; font-weight: 700; }
.hint { min-height: 1.4em; color: var(--muted); font-size: 13px; }

/* ---------- Каркас ---------- */
.shell { display: grid; grid-template-columns: 252px minmax(0, 1fr) auto; min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 18px; padding: 18px 14px; overflow-y: auto; }
.side .brand { padding: 2px 6px 6px; }
.nav-g { display: flex; flex-direction: column; gap: 2px; }
.nav-gl { color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; padding: 8px 10px 6px; }
.nav-i { display: flex; align-items: center; gap: 12px; width: 100%; border: none; background: none; color: var(--muted); padding: 10px 12px; border-radius: var(--r); font-weight: 500; text-align: left; }
.nav-i:hover { background: var(--surface); color: var(--ink); }
.nav-i[aria-current="page"] { background: var(--accent); color: var(--on-accent); font-weight: 600; }
.nav-i .nb { margin-left: auto; font-size: 12px; background: var(--accent-soft); color: var(--accent); padding: 1px 8px; border-radius: 999px; font-weight: 600; }
.nav-i[aria-current="page"] .nb { background: rgba(0, 0, 0, .18); color: var(--on-accent); }
.side-foot { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 10px; background: var(--surface); border-radius: var(--r); }
.me-chip { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.me-chip strong { display: block; line-height: 1.2; }
.me-chip small { color: var(--muted); font-size: 12px; }
.av { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 14px; flex: none; background: var(--accent-soft); color: var(--accent); }
.av.ulya { background: rgba(186, 186, 186, .18); color: #BABABA; }
:root[data-theme="light"] .av.ulya { color: #636363; }
.av.s { width: 26px; height: 26px; font-size: 12px; }
.av.l { width: 56px; height: 56px; font-size: 22px; }
.ibtn { width: 40px; height: 40px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); color: var(--muted); display: grid; place-items: center; flex: none; }
.ibtn:hover { color: var(--ink); border-color: var(--accent); }
.ibtn[aria-expanded="true"] { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: 0; z-index: 15; display: flex; align-items: center; gap: 10px; padding: 12px 24px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.brand-m { display: none; }
.search { position: relative; flex: 1; max-width: 560px; }
.search > span { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; display: grid; }
.search input { width: 100%; height: 42px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); padding: 0 40px 0 40px; }
.search kbd { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-family: var(--font-mono); font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; }
.qres { position: absolute; left: 0; right: 0; top: 48px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: 0 16px 40px rgba(0, 0, 0, .35); padding: 6px; max-height: 70vh; overflow-y: auto; z-index: 40; }
.qr { display: flex; align-items: center; gap: 10px; width: 100%; border: none; background: none; text-align: left; padding: 9px 10px; border-radius: 8px; }
.qr:hover, .qr:focus-visible { background: var(--surface-2); }
.qr b { font-weight: 500; overflow-wrap: anywhere; }
.qr small { display: block; color: var(--muted); font-size: 12px; }
.qr .ic { color: var(--accent); }
.qno { padding: 12px; color: var(--muted); font-size: 14px; }
.view { padding: 24px; display: flex; flex-direction: column; gap: 20px; min-width: 0; max-width: 1180px; width: 100%; margin: 0 auto; }
.view h1 { font-size: clamp(24px, 4vw, 32px); font-weight: 700; letter-spacing: -.01em; line-height: 1.15; }
.view h2 { font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: .12em; text-transform: uppercase; }
.lead { color: var(--muted); max-width: 46em; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.dock { width: 0; overflow: hidden; }

/* ---------- Базовые элементы ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 8px 16px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface-2); font-weight: 600; font-size: 14px; text-decoration: none; color: var(--ink); }
.btn:hover { border-color: var(--accent); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.small { min-height: 34px; padding: 5px 12px; font-size: 13px; }
.btn.danger { border-color: var(--bad); color: var(--bad); background: transparent; }
.btn[data-armed] { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.yes[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: #fff; }
.btn.no[aria-pressed="true"] { background: var(--bad); border-color: var(--bad); color: #fff; }
.link { border: none; background: none; color: var(--accent); font-weight: 600; font-size: 13px; padding: 4px 0; }
.link:hover { text-decoration: underline; }
.x { border: none; background: none; color: var(--muted); font-size: 18px; width: 34px; height: 34px; border-radius: 8px; display: inline-grid; place-items: center; }
.x:hover { color: var(--bad); background: var(--surface-2); }
.x.e:hover { color: var(--accent); }
.sub { display: flex; gap: 8px; flex-wrap: wrap; }
.sub button { border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 999px; padding: 6px 14px; font-size: 14px; font-weight: 500; min-height: 36px; }
.sub button:hover { color: var(--ink); }
.sub button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--surface); }
.seg button { border: none; background: none; color: var(--muted); padding: 8px 14px; font-size: 14px; font-weight: 500; min-height: 38px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); font-weight: 600; }
.card, .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
.card > header, .panel-h-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: var(--pad) var(--pad) 8px; }
.card-b { padding: 4px var(--pad) var(--pad); display: flex; flex-direction: column; gap: 6px; }
.panel-h { padding: var(--pad) var(--pad) 0; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.panel-b { padding: 12px var(--pad) var(--pad); display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
.panel-b p { color: var(--muted); }
.panel > .panel-h + .panel-b { padding-top: 10px; }
.panel .kvs:first-of-type { padding-top: 10px; }
.empty { padding: 22px var(--pad); color: var(--muted); text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.empty .ic { width: 28px; height: 28px; color: var(--accent); opacity: .8; }
.err { padding: 12px 14px; border: 1px solid var(--bad); border-radius: var(--r); color: var(--bad); background: var(--surface); }
.local-note { font-size: 13px; color: var(--muted); border-left: 2px solid var(--line); padding-left: 10px; }
.badge { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); font-weight: 500; white-space: nowrap; }
.badge.yes, .badge.done { color: var(--ok); border-color: var(--ok); }
.badge.no { color: var(--bad); border-color: var(--bad); }
.badge.doing { color: var(--accent); border-color: var(--accent); }
.badge.review { color: var(--warn); border-color: var(--warn); }
.badge.late { color: var(--bad); border-color: var(--bad); }
.fl { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; }
.fl.high { color: var(--bad); } .fl.mid { color: var(--warn); } .fl.low { color: var(--muted); }
.cdot { width: 9px; height: 9px; border-radius: 50%; background: var(--c, var(--accent)); display: inline-block; flex: none; }

/* ---------- Формы ---------- */
.form { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; padding: var(--pad); align-items: end; }
.form label, .fld { display: flex; flex-direction: column; gap: 5px; font-size: 13px; color: var(--muted); min-width: 0; }
.form .wide, .wide { grid-column: 1 / -1; }
input, select, textarea { background: var(--bg); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; min-width: 0; color: var(--ink); min-height: 42px; }
input[type="checkbox"] { min-height: 0; padding: 0; }
.form-msg { color: var(--muted); font-size: 14px; min-height: 1.4em; }
.edit-form { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; width: 100%; }
.edit-form input { flex: 1 1 140px; }
.edit-form input[name="t"] { flex: 2 1 220px; }
.acts { display: inline-flex; gap: 2px; }
.acts-row { display: flex; gap: 8px; flex-wrap: wrap; }
.adm-msg { color: var(--muted); font-size: 14px; min-height: 1.4em; }

/* ---------- Списки ---------- */
.list { list-style: none; margin: 0; padding: 0; }
.item { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; padding: 12px var(--pad); align-items: center; }
.item + .item { border-top: 1px solid var(--line); }
.item.one, .ev.one { display: block; }
.item input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--accent); }
.item.done .t { text-decoration: line-through; color: var(--muted); }
.t { overflow-wrap: anywhere; }
.when { color: var(--muted); font-size: 13px; }
.ev { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px 16px; padding: 14px var(--pad); align-items: center; }
.ev + .ev { border-top: 1px solid var(--line); }
.ev h3 { font-size: 16px; font-weight: 600; overflow-wrap: anywhere; }
.meta { color: var(--muted); font-size: 13px; display: flex; gap: 4px 12px; flex-wrap: wrap; margin-top: 2px; align-items: center; }
.votes { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.day-head { padding: 10px var(--pad); background: var(--surface-2); border-radius: var(--r) var(--r) 0 0; font-size: 13px; font-weight: 600; }

/* ---------- Главная ---------- */
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px var(--pad); display: flex; flex-direction: column; gap: 2px; }
.kpi span { color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; }
.kpi b { font-size: 28px; font-weight: 700; line-height: 1.15; }
.kpi.bad b { color: var(--bad); }
.trow { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 11px var(--pad); cursor: pointer; border-radius: 0; }
.trow + .trow { border-top: 1px solid var(--line); }
.trow:hover { background: var(--surface-2); }
.trow.done .ttl { text-decoration: line-through; color: var(--muted); }
.ttl { font-weight: 500; overflow-wrap: anywhere; }
.tmeta { display: flex; gap: 4px 10px; flex-wrap: wrap; align-items: center; color: var(--muted); font-size: 12.5px; margin-top: 3px; }
.chk { width: 22px; height: 22px; border-radius: 7px; border: 1.8px solid var(--muted); background: none; display: grid; place-items: center; padding: 0; color: transparent; }
.chk:hover { border-color: var(--accent); }
.chk[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: #fff; }
.chk .ic { width: 14px; height: 14px; stroke-width: 3; }
.datechip { width: 44px; text-align: center; border-radius: 10px; background: var(--surface-2); padding: 4px 0; flex: none; }
.datechip b { display: block; font-size: 17px; line-height: 1.1; }
.datechip small { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
.erow { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 11px var(--pad); cursor: pointer; }
.erow + .erow { border-top: 1px solid var(--line); }
.erow:hover { background: var(--surface-2); }
.feed { display: flex; gap: 10px; padding: 10px var(--pad); align-items: flex-start; }
.feed + .feed { border-top: 1px solid var(--line); }
.feed .d { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.feed time { margin-left: auto; color: var(--muted); font-size: 12px; white-space: nowrap; }
.quick { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding: 4px var(--pad) var(--pad); }
.quick .btn { justify-content: flex-start; min-height: 48px; }
.quick .btn .ic { color: var(--accent); }
.quick .btn.primary .ic { color: inherit; }

/* ---------- Задачи ---------- */
.tools { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.tools input[type="search"] { flex: 1 1 200px; min-width: 0; }
.tools select { min-height: 38px; padding: 6px 10px; }
.board { display: grid; grid-template-columns: repeat(4, minmax(220px, 1fr)); gap: 14px; overflow-x: auto; padding-bottom: 4px; }
.col { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); display: flex; flex-direction: column; min-width: 0; }
.col > h3 { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px 8px; font-size: 13px; font-weight: 600; }
.col > h3 span { color: var(--muted); font-weight: 500; }
.col-b { padding: 6px 10px 12px; display: flex; flex-direction: column; gap: 8px; min-height: 60px; }
.tcard { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; display: flex; flex-direction: column; gap: 8px; cursor: pointer; }
.tcard:hover { border-color: var(--accent); }
.tcard .ttl { font-size: 14px; }
.tcard select { min-height: 32px; padding: 3px 8px; font-size: 13px; }
.tcard .foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.cm { display: flex; gap: 10px; padding: 10px 0; align-items: flex-start; }
.cm + .cm { border-top: 1px solid var(--line); }
.cm .b { flex: 1; min-width: 0; overflow-wrap: anywhere; font-size: 14px; }
.cm .b small { color: var(--muted); display: block; font-size: 12px; }

/* ---------- Календарь ---------- */
.cal-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.cal-title { font-size: 20px; font-weight: 700; min-width: 0; flex: 1 1 200px; }
.legend { display: flex; gap: 8px; flex-wrap: wrap; }
.legend button { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 999px; padding: 4px 11px; font-size: 13px; min-height: 32px; }
.legend button[aria-pressed="false"] { opacity: .45; }
.mgrid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--line); gap: 1px; }
.mdow { background: var(--surface-2); padding: 8px; font-size: 12px; color: var(--muted); text-align: center; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; }
.mcell { background: var(--surface); min-height: 108px; padding: 6px; display: flex; flex-direction: column; gap: 3px; cursor: pointer; min-width: 0; }
.mcell:hover { background: var(--surface-2); }
.mcell.off { background: var(--bg); }
.mcell.off .dn { opacity: .45; }
.dn { align-self: flex-start; font-size: 13px; font-weight: 600; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; border: none; background: none; color: var(--ink); }
.dn:hover { background: var(--accent-soft); }
.mcell.today .dn { background: var(--accent); color: var(--on-accent); }
.chip { display: flex; align-items: center; gap: 5px; border: none; border-left: 3px solid var(--c, var(--accent)); background: color-mix(in srgb, var(--c, var(--accent)) 16%, transparent); border-radius: 5px; padding: 1px 6px; font-size: 12px; text-align: left; width: 100%; min-width: 0; color: var(--ink); line-height: 1.5; }
.chip b { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip em { font-style: normal; color: var(--muted); font-family: var(--font-mono); font-size: 11px; }
.more { font-size: 12px; color: var(--muted); padding-left: 4px; }
.wgrid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; }
.wday { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); display: flex; flex-direction: column; min-width: 0; min-height: 160px; }
.wday.today { border-color: var(--accent); }
.wday > header { padding: 10px 10px 6px; display: flex; align-items: baseline; justify-content: space-between; }
.wday > header b { font-size: 20px; }
.wday > header span { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
.wday .wb { padding: 4px 8px 10px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.wadd { border: 1px dashed var(--line); background: none; color: var(--muted); border-radius: 8px; padding: 4px; font-size: 13px; margin-top: auto; }
.wadd:hover { color: var(--accent); border-color: var(--accent); }
.dcard { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 13px var(--pad); border-left: 4px solid var(--c, var(--accent)); cursor: pointer; }
.dcard + .dcard { border-top: 1px solid var(--line); }
.dcard:hover { background: var(--surface-2); }
.dcard .tm { font-family: var(--font-mono); font-size: 14px; min-width: 3.4em; color: var(--muted); }
.dcard h3 { font-size: 16px; font-weight: 600; overflow-wrap: anywhere; }

/* ---------- Люди, расписание ---------- */
.phead { display: flex; align-items: center; gap: 14px; }
.phead p { color: var(--muted); font-size: 14px; }
.wk { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-top: 4px; }
.dayc { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.dayc.past { opacity: .55; }
.dayc.today { border-color: var(--accent); }
.dayc header { display: flex; align-items: baseline; gap: 10px; padding: 10px var(--pad); background: var(--surface-2); }
.dayc h3 { font-size: 15px; }
.dayc .date { color: var(--muted); font-size: 13px; font-family: var(--font-mono); }
.dayc .pill { margin-left: auto; background: var(--accent); color: var(--on-accent); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; padding: 2px 9px; border-radius: 999px; font-weight: 600; }
.pair { display: grid; grid-template-columns: 2rem minmax(0, 1fr) auto; gap: 12px; padding: 10px var(--pad); align-items: center; }
.pair + .pair { border-top: 1px solid var(--line); }
.pair .n { font-family: var(--font-mono); color: var(--muted); border: 1px solid var(--line); border-radius: 8px; text-align: center; padding: 2px 0; }
.pair .s { font-weight: 500; overflow-wrap: anywhere; }
.pair .tm { font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
.pair .room { font-family: var(--font-mono); font-size: 13px; background: var(--surface-2); padding: 3px 9px; border-radius: 8px; white-space: nowrap; }
.pair.live { background: var(--accent-soft); }
.pair.live .n { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.pair.done { opacity: .5; }
.pair-r { display: inline-flex; align-items: center; gap: 6px; }
.flag { color: var(--accent); font-weight: 700; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; margin-left: 6px; font-style: normal; }
.sch-sum strong { font-weight: 700; }

/* ---------- Чертежи ---------- */
.proj { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; align-items: start; }
.proj-head { padding: var(--pad); border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.proj-head h3 { font-size: 18px; }
.ver { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; padding: 12px var(--pad); align-items: center; }
.ver + .ver { border-top: 1px solid var(--line); }
.ver .t { font-weight: 500; }
.ver .note { grid-column: 1 / -1; color: var(--muted); font-size: 13px; margin-top: -6px; overflow-wrap: anywhere; }
.ver .when { font-family: var(--font-mono); font-size: 13px; }
.search { }
.dgroup { padding: var(--pad); border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.dgroup[hidden] { display: none; }
.dg-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.dg-head h4 { font-size: 16px; font-weight: 600; overflow-wrap: anywhere; }
.latest { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 2px 9px; flex: none; font-weight: 600; }
.dg-meta { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.dg-acts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.prev { display: block; max-width: 100%; max-height: 260px; object-fit: contain; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
.pdfbox iframe { width: 100%; height: 420px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
.older { border-top: 1px dashed var(--line); padding-top: 8px; }
.older summary { cursor: pointer; color: var(--muted); font-size: 14px; }
.older .ver { padding: 8px 0 0; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.dl { color: var(--accent); font-weight: 600; font-size: 13px; }
details.up { border-top: 1px solid var(--line); }
details.up summary { padding: 12px var(--pad); cursor: pointer; color: var(--accent); font-weight: 600; font-size: 14px; }

/* ---------- Админ ---------- */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px var(--pad); display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat span { color: var(--muted); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; font-weight: 600; }
.stat b { font-size: 28px; font-weight: 700; line-height: 1.15; }
.stat small { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.kvs { margin: 0; padding: 4px var(--pad) 14px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 8px 16px; font-size: 14px; }
.kvs + .kvs { border-top: 1px solid var(--line); padding-top: 14px; }
.kvs dt { color: var(--muted); overflow-wrap: anywhere; }
.kvs dd { margin: 0; text-align: right; font-family: var(--font-mono); font-size: 13px; overflow-wrap: anywhere; }
.banner { padding: 12px var(--pad); background: var(--accent); color: var(--on-accent); border-radius: var(--r); font-size: 13px; font-weight: 600; width: 100%; }
.banner.ok { background: var(--accent-soft); color: var(--accent); }
.bar { width: 100%; height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }
.opt { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px var(--pad); cursor: pointer; }
.opt + .opt { border-top: 1px solid var(--line); }
.opt input { width: 22px; height: 22px; accent-color: var(--accent); flex: none; }
.lr { display: grid; grid-template-columns: 6.4rem minmax(0, 1fr); gap: 2px 12px; padding: 10px var(--pad); font-size: 14px; }
.lr + .lr { border-top: 1px solid var(--line); }
.lr time { font-family: var(--font-mono); color: var(--muted); font-size: 13px; }
.lr .d { color: var(--muted); overflow-wrap: anywhere; }
.ses { display: flex; justify-content: space-between; gap: 12px; padding: 10px var(--pad); font-size: 14px; flex-wrap: wrap; }
.ses + .ses { border-top: 1px solid var(--line); }
.ses span:last-child { color: var(--muted); font-family: var(--font-mono); font-size: 13px; }

/* ---------- Окно, сообщения, прогресс, нижняя панель, помощник ---------- */
.modal { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 16px; }
.modal-back { position: absolute; inset: 0; background: rgba(7, 7, 7, .62); }
.modal-card { position: relative; width: min(560px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.modal-card > header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.modal-card h2 { font-size: 18px; font-weight: 700; letter-spacing: 0; text-transform: none; color: var(--ink); }
.mform { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.mform .wide { grid-column: 1 / -1; }
.mform .btns { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.toasts { position: fixed; z-index: 80; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; width: min(420px, calc(100vw - 24px)); }
.toast { display: flex; align-items: center; gap: 10px; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 14px; box-shadow: 0 10px 30px rgba(0, 0, 0, .35); font-size: 14px; animation: tin .2s ease-out; }
.toast .ic { color: var(--ok); }
.toast.bad { border-color: var(--bad); }
.toast.bad .ic { color: var(--bad); }
.toast.out { opacity: 0; transition: opacity .3s; }
@keyframes tin { from { transform: translateY(8px); opacity: 0; } }
.progress { position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 90; background: linear-gradient(90deg, transparent, var(--accent), transparent); background-size: 40% 100%; background-repeat: no-repeat; opacity: 0; animation: prog 1s linear infinite; pointer-events: none; }
.progress.on { opacity: 1; }
@keyframes prog { from { background-position: -40% 0; } to { background-position: 140% 0; } }
.skel { height: 72px; border-radius: var(--r); background: linear-gradient(90deg, var(--surface) 25%, var(--surface-2) 50%, var(--surface) 75%); background-size: 200% 100%; animation: sk 1.2s infinite; }
@keyframes sk { to { background-position: -200% 0; } }

.bottom { position: fixed; z-index: 30; left: 0; right: 0; bottom: 0; display: none; background: var(--side); border-top: 1px solid var(--line); padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px)); justify-content: space-around; }
.bottom button { flex: 1; border: none; background: none; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; font-weight: 500; padding: 6px 2px; min-height: 52px; border-radius: 10px; }
.bottom button[aria-current="page"] { color: var(--accent); }
.bottom button[aria-current="page"] .ic { stroke-width: 2.3; }
.sheet { position: fixed; inset: 0; z-index: 50; }
.sheet-back { position: absolute; inset: 0; background: rgba(7, 7, 7, .6); }
.sheet-card { position: absolute; left: 0; right: 0; bottom: 0; background: var(--surface); border-radius: 20px 20px 0 0; border: 1px solid var(--line); padding: 14px 14px calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 4px; }
.sheet-card .nav-i { padding: 14px 12px; }

.dock-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.dock-h strong { font-size: 16px; }
.dock-h .acts { gap: 6px; }
.chat-log { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 14px; }
.chat-msg { max-width: 90%; padding: 9px 12px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px; position: relative; }
.chat-msg.ai { align-self: flex-start; background: var(--surface-2); border-bottom-left-radius: 4px; }
.chat-msg.me { align-self: flex-end; background: var(--accent); color: var(--on-accent); border-bottom-right-radius: 4px; }
.chat-msg.err { color: var(--muted); font-style: italic; }
.chat-msg .sv { margin-left: 8px; border: none; background: none; color: var(--muted); padding: 0; font-size: 15px; line-height: 1; }
.chat-msg .sv[aria-pressed="true"] { color: var(--warn); }
.chat-ctx { display: flex; gap: 8px; padding: 8px 12px 0; }
.chat-ctx select { flex: 1; min-width: 0; min-height: 36px; padding: 4px 8px; font-size: 13px; }
.chat-form { display: flex; gap: 8px; align-items: flex-end; padding: 10px 12px 12px; }
.chat-form textarea { flex: 1; min-width: 0; resize: none; max-height: 120px; line-height: 1.4; }
.hist { flex: 1; min-height: 0; overflow-y: auto; padding: 10px 14px; display: flex; flex-direction: column; gap: 6px; }
.hist h4 { color: var(--muted); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; margin: 8px 0 2px; }
.hist button.hi { text-align: left; border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 9px 12px; font-size: 14px; }
.hist .sv-i { border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }

@media (min-width: 1200px) {
  .dock:not([hidden]) { width: 360px; border-left: 1px solid var(--line); background: var(--side); position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
}
@media (max-width: 1199px) {
  .dock:not([hidden]) { position: fixed; z-index: 55; right: 0; top: 0; bottom: 0; width: min(400px, 100%); background: var(--surface); border-left: 1px solid var(--line); display: flex; flex-direction: column; overflow: hidden; }
}
@media (max-width: 900px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .shell > .side { display: none; }
  .topbar { padding: 10px 14px; padding-top: max(10px, env(safe-area-inset-top, 0px)); }
  .brand-m { display: flex; }
  .brand-m .brand-n, .brand-m .brand-s { display: none; }
  .brand-m .brand-ic { width: 40px; height: 40px; }
  .view { padding: 16px 14px 104px; }
  .bottom { display: flex; }
  .search kbd { display: none; }
  .grid2 { grid-template-columns: minmax(0, 1fr); }
  .board { grid-template-columns: repeat(4, minmax(240px, 1fr)); margin-inline: -14px; padding-inline: 14px; }
  .wgrid { grid-template-columns: minmax(0, 1fr); }
  .wday { min-height: 0; }
  .mform { grid-template-columns: minmax(0, 1fr); }
  .btn, .sub button, .seg button { min-height: 44px; }
  .btn.small { min-height: 40px; }
}
@media (max-width: 700px) {
  .mcell { min-height: 58px; padding: 4px 3px; align-items: center; }
  .mcell .chip { width: 8px; height: 8px; padding: 0; border: none; border-radius: 50%; background: var(--c); }
  .mcell .chip b, .mcell .chip em { display: none; }
  .mcell .cells { display: flex; flex-wrap: wrap; gap: 3px; justify-content: center; }
  .mcell .more { padding: 0; font-size: 10px; }
  .mdow { padding: 6px 2px; font-size: 10px; letter-spacing: 0; }
  .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .kpi { padding: 10px; } .kpi b { font-size: 22px; } .kpi span { font-size: 10px; letter-spacing: .04em; }
  .item { grid-template-columns: auto minmax(0, 1fr) auto; }
  .ev { grid-template-columns: 1fr; }
  .lr { grid-template-columns: 5.6rem minmax(0, 1fr); }
}

.adm-body { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.mcell.sel { outline: 2px solid var(--accent); outline-offset: -2px; }
.card > header h2 { font-size: 13px; }
.row h1 { min-width: 0; }
.qr .ic { flex: none; }
.mform .form-msg:empty, .mform .local-note:empty { display: none; }
.av.c0 { background: rgba(183, 183, 183, .18); color: #B7B7B7; }
.av.c1 { background: rgba(182, 182, 182, .18); color: #B6B6B6; }
.av.c2 { background: rgba(190, 190, 190, .18); color: #BEBEBE; }
.av.c3 { background: rgba(181, 181, 181, .18); color: #B5B5B5; }
.av.c4 { background: rgba(186, 186, 186, .18); color: #BABABA; }
:root[data-theme="light"] .av.c0 { color: #686868; }
:root[data-theme="light"] .av.c1 { color: #707070; }
:root[data-theme="light"] .av.c2 { color: #6C6C6C; }
:root[data-theme="light"] .av.c3 { color: #676767; }
:root[data-theme="light"] .av.c4 { color: #5F5F5F; }
.mrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 12px var(--pad); }
.mrow + .mrow { border-top: 1px solid var(--line); }
.mrow .mi { display: flex; align-items: center; gap: 12px; min-width: 0; }
@media (min-width: 901px) { .toasts { bottom: 24px; } }
@media (max-width: 700px) { .mcell .chip { pointer-events: none; } }

/* ---- новые части: лента дня, ожидание ответа, реакции, колокольчик, офлайн, знакомство ---- */
.frow, .wrow, .brow { display: grid; grid-template-columns: auto auto 1fr auto; gap: 10px; align-items: center; padding: 10px var(--pad); }
.frow + .frow, .wrow + .wrow, .brow + .brow { border-top: 1px solid var(--line); }
.frow[data-ev], .frow[data-task], .wt[data-task], .wt[data-ev], .brow { cursor: pointer; }
.frow .tm { font-family: var(--font-mono); font-size: 12px; color: var(--muted); min-width: 40px; }
.wrow { grid-template-columns: auto 1fr auto; flex-wrap: wrap; }
.wrow .wt { min-width: 0; }
.brow { grid-template-columns: auto 1fr auto; }
.brow.unread { background: var(--accent-soft); }
.bell-list { margin: 0 calc(var(--pad) * -1); max-height: 60vh; overflow: auto; }
.dotn { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); display: inline-block; }
#more-n.dotn { position: absolute; top: 6px; right: calc(50% - 16px); }
.bottom button { position: relative; }
.ibtn { position: relative; }
.ibtn .nb { position: absolute; top: -4px; right: -4px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--bad); color: #111111; font-size: 11px; font-weight: 700; line-height: 18px; text-align: center; }
.reacts { display: flex; flex-wrap: wrap; gap: 8px; }
.rbtn { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 6px 12px; font-size: 13px; }
.rbtn[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.men { color: var(--accent); font-weight: 600; }
.av.on { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--ok); }
.banner.notice, .banner { display: flex; gap: 10px; align-items: flex-start; padding: 12px var(--pad); border-radius: var(--r); background: var(--accent-soft); border: 1px solid rgba(162, 162, 162, .35); }
.banner span { color: var(--ink); }
.banner.notice .ic { flex: none; margin-top: 2px; color: var(--accent); }
#offline { margin: 0; padding: 8px var(--pad); background: var(--warn); color: #141414; font-size: 13px; text-align: center; font-weight: 600; }
.toast { pointer-events: auto; }
.toast .link { margin-left: 8px; color: var(--accent); background: none; border: 0; font-weight: 600; text-decoration: underline; }
.ckrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.ckrow + .ckrow { border-top: 1px solid var(--line); }
.strike { text-decoration: line-through; color: var(--muted); }
.chipck { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface-2); font-size: 13px; cursor: pointer; }
fieldset.fld { border: 0; padding: 0; margin: 0; min-width: 0; }
fieldset.fld legend { padding: 0 0 6px; font-size: 13px; color: var(--muted); }
.tour { text-align: center; padding: 8px 0 16px; }
.tour .ic { width: 44px; height: 44px; color: var(--accent); }
.tour h3 { margin: 10px 0 6px; font-size: 18px; }
.tour p { margin: 0; color: var(--muted); }
.wt { min-width: 0; }
.topbar #new-btn { width: auto; padding: 0 12px; gap: 6px; display: inline-flex; align-items: center; }
.topbar #new-btn .lbl { font-size: 14px; font-weight: 600; }
@media (max-width: 700px) { .topbar #new-btn .lbl { display: none; } .frow { grid-template-columns: auto auto 1fr; } .frow .badge { grid-column: 3; justify-self: start; } }

/* ---- чёрно-белая тема: статусы различаются формой, а не цветом ---- */
.cdot { box-shadow: 0 0 0 1px var(--line); }
.fl.high { padding: 1px 8px; border-radius: 999px; }
.badge.late, .badge.no, .fl.high { background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 700; }
.badge.yes, .badge.done { border-color: var(--ink); color: var(--ink); }
.badge.review { border-style: dashed; }

  async function loadAdmin() {
    var my = ++admSeq, s = asub, html = '';

      if (s === 'sum') html = admSum(await arpc('vx_admin_overview', {}));

      else if (s === 'files') html = admFiles(await arpc('vx_admin_storage', {}));

      return;

  /* --- обработчики --- */
  function armed(btn) {
    if (!btn.hasAttribute('data-confirm')) return true;
    if (btn.hasAttribute('data-armed')) return true;
    btn.setAttribute('data-armed', '1'); btn.setAttribute('data-old', btn.textContent); btn.textContent = 'Точно? Нажми ещё раз';
    setTimeout(function () { if (btn.isConnected && btn.hasAttribute('data-armed')) { btn.removeAttribute('data-armed'); btn.textContent = btn.getAttribute('data-old'); } }, 4000);
    return false;
  }
  async function waitClean() { for (var i = 0; i < 100 && cleaning; i++) await sleep(150); }

    if (di) { delItem(di.getAttribute('data-adm-del')); return; }
    if (!b || b.disabled || !armed(b)) return;
    var a = b.getAttribute('data-a'), arg = b.getAttribute('data-arg'), r;
    b.disabled = true;
    try {
      if (a === 'lock' || a === 'unlock') { await arpc('vx_admin_lock', { p_on: a === 'lock' }); await loadAdmin(); admSay(a === 'lock' ? 'Сайт закрыт для остальных.' : 'Сайт открыт.'); }
      else if (a === 'unlink') { await arpc('vx_tg_unlink', { p_name: arg }); await loadAdmin(); admSay('Telegram отключён: ' + nameOf(arg) + '.'); }

      else if (a === 'reset') { mReset(arg); }
      else if (a === 'member-del') { await arpc('vx_admin_member_remove', { p_name: arg }); await loadData(); await loadAdmin(); admSay(nameOf(arg) + ': удалён с сайта. При входе он увидит сообщение и предложение зарегистрироваться заново через Telegram.'); }
      else if (a === 'member-off' || a === 'member-on') { await arpc('vx_admin_member_set', { p_name: arg, p_off: a === 'member-off' }); await loadData(); await loadAdmin(); admSay(nameOf(arg) + (a === 'member-off' ? ': доступ закрыт, данные сохранены.' : ': доступ возвращён.')); }
      else if (a === 'inv-clear') { r = await arpc('vx_admin_member_invites_clear', {}); await loadAdmin(); admSay('Приглашений отменено: ' + (r || 0) + '.'); }
      else if (a === 'purge') {
        r = await arpc('vx_admin_purge', { p_what: arg }); await loadData(); render();
        admSay(r >= 0 ? 'Удалено записей: ' + r + '.' : 'Не получилось.');
      } else if (a === 'clean') {
        r = await arpc('vx_admin_clean_orphans', {}); await loadData(); await waitClean(); await loadAdmin();
        admSay('Лишних файлов стёрто: ' + (r || 0) + '.');
      } else if (a === 'backup') {
        r = await arpc('vx_admin_backup', {});
        downloadJson('vexxo-backup-' + moscowNow().date + '.json', r); admSay('Копия скачана.');
      } else if (a === 'run') {
        await arpc('vx_admin_run', { p_job: arg });
        admSay(arg === 'digest' ? 'Сводка отправлена. Проверь Telegram.' : 'Напоминания разосланы (если было кому).');
      } else if (a === 'tg-test') {
        admSay('Отправляю…');
        var rid = await arpc('vx_admin_tg', { p_to: 'maxim', p_text: 'Проверка связи: сайт VEXXO → Telegram' });
        if (!rid) { admSay('Не отправлено: нет токена бота или chat_id.'); }
        else {
          var res = 'Ответа от Telegram пока нет. Проверь сообщение через минуту.';
          for (var i = 0; i < 8; i++) {
            await sleep(1500);
            var st = await arpc('vx_admin_tg_status', { p_id: rid });
            if (st.state === 'ok') { res = 'Telegram принял сообщение (код ' + st.status + '). Оно должно быть в чате.'; break; }
            if (st.state === 'fail') { res = 'Telegram отказал: ' + (st.status || st.error || 'ошибка') + ' ' + String(st.body || '').slice(0, 120); break; }
          }
          admSay(res);
        }
      }
    } catch (err) {
      admSay(err && err.forbidden ? 'Нет доступа. Выйди и войди заново.' : 'Не получилось: ' + (/site_locked|Failed to fetch/.test(err.message || '') ? 'нет связи.' : 'ошибка сервера.'));
    }
    if (b.isConnected) { b.disabled = false; b.removeAttribute('data-armed'); if (b.getAttribute('data-old')) b.textContent = b.getAttribute('data-old'); }
  }
  async function admChange(e) {
    var chk = e.target.closest('[data-adm-chk]'), fl = e.target.closest('[data-flag]'), mu = e.target.closest('[data-mute]'), rg = e.target.closest('[data-reg]');
    if (rg) {
      var ron = rg.checked;
      try { await arpc('vx_admin_set', { p_key: 'open_reg', p_on: ron }); admSay(ron ? 'Открытая регистрация включена.' : 'Открытая регистрация выключена: только по приглашению.'); }
      catch (err) { rg.checked = !ron; admSay('Не удалось сохранить.'); }
      return;
    }
    if (mu) {
      var recv = mu.checked;
      try { await arpc('vx_admin_set', { p_key: 'tg_mute_' + mu.getAttribute('data-mute'), p_on: !recv }); admSay(recv ? 'Сообщения включены.' : 'Сообщения отключены.'); }
      catch (err) { mu.checked = !recv; admSay('Не удалось сохранить.'); }
      return;
    }
    if (chk) { var done = chk.checked; act(function () { return rpc('vx_item_set', { p_code: CODE, p_id: chk.getAttribute('data-adm-chk'), p_done: done }); }); return; }
    if (fl) {
      var on = fl.checked;
      try { await arpc('vx_admin_set', { p_key: 'tg_' + fl.getAttribute('data-flag'), p_on: on }); admSay('Сохранено.'); }
      catch (err) { fl.checked = !on; admSay('Не удалось сохранить.'); }
    }
  }
  async function admSubmit(e) {
    var f = e.target;
    if (f.id === 'mi-form') {
      e.preventDefault();
      mMemberInvite($('mi-note').value.trim());
    } else if (f.id === 'tg-form') {
      e.preventDefault();
      var txt = $('tg-text').value.trim(); if (!txt) return;
      try {
        var rid = await arpc('vx_admin_tg', { p_to: $('tg-to').value, p_text: txt });
        admSay(rid ? 'Отправлено.' : 'Не отправлено: нет токена бота или chat_id.');
        if (rid) $('tg-text').value = '';
      } catch (err) { admSay('Нет связи с сервером.'); }
    }
  }
  function statusBadge(ev, who) {
    var v = ev.votes[who];
    var t = v === 'yes' ? (FEM[who] ? 'согласна' : 'согласен') : v === 'no' ? 'отказ' : 'ждёт';
    return '<span class="badge ' + (v || '') + '">' + esc(NAMES[who]) + ': ' + t + '</span>';
  }

  /* --- Участники: приглашение нового человека через бота, сброс пароля, отключение --- */
  function admMem(o) {
    var mem = o.members || [], u = o.users || {}, chats = (o.tg || {}).chats || {}, rg = o.reg || {};
    var h = '<section class="panel"><h2 class="panel-h">Новый участник</h2><div class="panel-b">' +
      '<p>Создай ссылку и отправь человеку. Он нажимает её, в Telegram жмёт «Запустить», пишет боту своё имя и придумывает пароль. После этого бот присылает ему ссылку на сайт, а в списке участников появляется новый человек с отдельной страницей. Ссылка одноразовая, действует 7 дней.</p>' +
      '<form class="form" id="mi-form"><label>Для кого (заметка для себя, по желанию)<input id="mi-note" maxlength="40" autocomplete="off" placeholder="Например: Антон"></label><button class="btn primary" type="submit">Создать приглашение</button></form>' +
      (rg.pending ? '<p class="when">Неиспользованных приглашений: ' + rg.pending + '</p><button type="button" class="btn small" data-a="inv-clear" data-confirm="1">Отменить все приглашения</button>' : '') + '</div></section>';
    h += '<section class="panel"><h2 class="panel-h">Регистрация через бота</h2>' +
      '<label class="opt"><span><strong>Открытая регистрация</strong><br><span class="when">Выключено: аккаунт можно создать только по твоей ссылке-приглашению. Если включить, зарегистрироваться сможет любой, кто нажмёт «Запустить» у бота. Включай ненадолго.</span></span><input type="checkbox" data-reg="open"' + (rg.open ? ' checked' : '') + '></label>' +
      kvs([['Приём сообщений от Telegram (webhook)', rg.webhook ? 'включён' : 'выключен: бот не сможет регистрировать людей'], ['Последнее сообщение боту', rg.last ? esc(fmtDt(rg.last)) : 'ещё не было']].concat(rg.err ? [['Последняя ошибка бота', esc(rg.err)]] : [])) + '</section>';
    h += '<section class="panel"><h2 class="panel-h">Участники (' + mem.length + ')</h2>';
    mem.forEach(function (m) {
      var x = u[m.name] || {}, root = m.name === 'maxim';
      h += '<div class="mrow"><div class="mi">' + av(m.name) + '<div><strong>' + esc(m.title) + '</strong>' + (m.off ? ' <span class="badge no">отключён</span>' : '') + (root ? ' <span class="badge">админ</span>' : '') +
        '<br><span class="when">' + (chats[m.name] ? 'Telegram подключён' : 'Telegram не подключён') + ' · устройств: ' + (x.sessions || 0) + ' · был: ' + esc(ago(x.last_seen)) + '</span></div></div><div class="acts-row">' +
        '<button type="button" class="btn small" data-invite="' + esc(m.name) + '">' + (chats[m.name] ? 'Новая ссылка Telegram' : 'Подключить Telegram') + '</button>' +
        (root ? '' : '<button type="button" class="btn small" data-a="reset" data-arg="' + esc(m.name) + '">Сбросить пароль</button>' +
          '<button type="button" class="btn small" data-a="kick" data-arg="' + esc(m.name) + '" data-confirm="1">Выйти на всех устройствах</button>' +
          (m.off ? '<button type="button" class="btn small primary" data-a="member-on" data-arg="' + esc(m.name) + '">Вернуть доступ</button>'
                 : '<button type="button" class="btn small" data-a="member-off" data-arg="' + esc(m.name) + '" data-confirm="1">Отключить</button>' +
                   '<button type="button" class="btn small danger" data-a="member-del" data-arg="' + esc(m.name) + '" data-confirm="1">Удалить с сайта</button>')) +
        '</div></div>';
    });
    return h + '</section><p class="local-note">Пароли хранятся только в виде хэша, увидеть их нельзя. Если человек забыл пароль, задай ему новый кнопкой «Сбросить пароль». Отключённый участник не может войти, его записи остаются.</p>';
  }
  function mReset(name) {
    openModal('Новый пароль: ' + nameOf(name), '<form class="mform" id="rs-form"><label class="fld wide">Пароль (6–12 цифр, не такой же, как у другого участника)<input id="rs-new" type="text" inputmode="numeric" autocomplete="off" pattern="[0-9]{6,12}" maxlength="12" required></label>' +
      '<p class="form-msg wide" id="rs-msg" role="status">Все устройства человека выйдут. Новый пароль передай ему сам.</p>' +
      '<div class="btns"><button type="button" class="btn" data-close-modal>Отмена</button><button type="submit" class="btn primary">Задать пароль</button></div></form>');
    $('rs-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      var nw = $('rs-new').value.trim(), msg = $('rs-msg');
      if (!/^[0-9]{6,12}$/.test(nw)) { msg.textContent = 'Пароль: от 6 до 12 цифр.'; return; }
      msg.textContent = 'Сохраняем…';
      try {
        var r = await arpc('vx_admin_reset_code', { p_new: nw, p_name: name });
        if (r === 'ok') { closeModal(); admSay('Пароль изменён: ' + nameOf(name) + '. Передай ему новый пароль.'); toast('Пароль изменён'); }
        else msg.textContent = r === 'taken' ? 'Такой пароль уже есть у другого участника, выбери другой.' : r === 'bad_new' ? 'Пароль: от 6 до 12 цифр.' : 'Не получилось.';
      } catch (err) { msg.textContent = 'Нет связи с сервером.'; }
    });
  }
  async function mMemberInvite(note) {
    openModal('Приглашение участника', '<div id="mv-body"><p class="when">Готовлю ссылку…</p></div>');
    var tok;
    try { tok = await arpc('vx_admin_member_invite', { p_note: note || null }); } catch (e) { closeModal(); showErr(e); return; }
    if (!tok) { closeModal(); toast('Не получилось: слишком много неиспользованных приглашений (максимум 10)', true); return; }
    var link = 'https://t.me/' + BOT_USER + '?start=' + tok, box = $('mv-body'); if (!box) return;
    var before = members().length;
    box.innerHTML = '<p>Отправь эту ссылку человеку' + (note ? ' (' + esc(note) + ')' : '') + '. Он нажимает её, в Telegram жмёт «Запустить», пишет боту имя и придумывает пароль. Ссылка одноразовая, действует 7 дней.</p>' +
      '<label class="fld" style="margin:12px 0">Ссылка<input id="mv-link" readonly value="' + esc(link) + '"></label>' +
      '<div class="acts-row"><button type="button" class="btn primary" id="mv-copy">Скопировать</button>' + (navigator.share ? '<button type="button" class="btn" id="mv-share">Поделиться</button>' : '') +
      '<a class="btn" href="' + esc(link) + '" target="_blank" rel="noopener">Открыть бота</a></div><p class="form-msg" id="mv-st" role="status" style="margin-top:12px">Жду, пока человек зарегистрируется…</p>';
    $('mv-copy').addEventListener('click', async function () {
      try { await navigator.clipboard.writeText(link); }
      catch (e) { var i = $('mv-link'); i.select(); try { document.execCommand('copy'); } catch (e2) {} }
      toast('Ссылка скопирована');
    });
    if ($('mv-share')) $('mv-share').addEventListener('click', function () { navigator.share({ title: 'VEXXO', text: 'Присоединяйся к VEXXO', url: link }).catch(function () {}); });
    for (var i = 0; i < 200 && $('mv-st'); i++) {
      await sleep(4000);
      if (!$('mv-st')) return;
      try {
        var o = await arpc('vx_admin_overview', {});
        if (!$('mv-st') || !o) continue;
        var cur = (o.members || []).filter(function (m) { return !m.off; });
        if (cur.length > before) {
          var nm = cur[cur.length - 1];
          $('mv-st').textContent = 'Присоединился: ' + nm.title + ' ✓'; toast('Новый участник: ' + nm.title);
          await loadData(); if (view === 'admin') loadAdmin();
          return;
        }
      } catch (e) {}
    }
  }
  /* ----- помощник Claude: сворачиваемая панель, история и сохранённые ответы (хранятся только на этом устройстве) ----- */
  // Адрес Worker из папки worker/ (см. README). Пока пусто.
  var CHAT_API_URL = '';
  // Если не пусто, помощник на любой вопрос отвечает этой фразой и не обращается к Claude. Чтобы включить настоящие ответы, поставь ''.
  var FIXED_REPLY = 'Россия Путин победа';
  var GREETING = 'Привет! Я Claude. Задай любой вопрос или прикрепи задачу.';
  var chat = { convs: [], saved: [], cur: null }, chatBusy = false;
  function chatKey() { return CKEY + ':' + state.me; }
  function chatLoad() {
    chat.convs = []; chat.saved = [];
    try { var d = JSON.parse(localStorage.getItem(chatKey()) || '{}'); if (Array.isArray(d.convs)) chat.convs = d.convs.slice(-30); if (Array.isArray(d.saved)) chat.saved = d.saved.slice(-50); } catch (e) {}
  }
  function chatStore() { try { localStorage.setItem(chatKey(), JSON.stringify({ convs: chat.convs.slice(-30), saved: chat.saved.slice(-50) })); } catch (e) {} }
  function chatNew() { chat.cur = { id: uuid(), title: '', at: Date.now(), msgs: [] }; $('chat-histbox').hidden = true; $('chat-log').hidden = false; chatPaint(); }
  function chatInit() { chatLoad(); chatNew(); }
  function isSaved(t) { return chat.saved.some(function (s) { return s.t === t; }); }
  function chatPaint() {
    var log = $('chat-log'), c = chat.cur, h = '<div class="chat-msg ai">' + esc(GREETING) + '</div>';
    (c ? c.msgs : []).forEach(function (m, i) {
      h += '<div class="chat-msg ' + m.r + (m.err ? ' err' : '') + '">' + esc(m.t) + (m.r === 'ai' && !m.err ? '<button type="button" class="sv" data-save="' + i + '" aria-pressed="' + isSaved(m.t) + '" aria-label="Сохранить ответ" title="Сохранить ответ">' + ic('star', true) + '</button>' : '') + '</div>';
    });
    log.innerHTML = h; log.scrollTop = log.scrollHeight;
  }
  function chatAttachList() {
    var sel = $('chat-attach'); if (!sel || !state.me) return;
    var v = sel.value, list = openTasksOf(state.me).sort(sortTasks).slice(0, 30);
    sel.innerHTML = '<option value="">Без вложения</option>' + list.map(function (i) { return opt(i.id, 'Задача: ' + i.text.slice(0, 50), v); }).join('');
  }
  function chatOpen(v) {
    $('dock').hidden = !v; $('chat-btn').setAttribute('aria-expanded', v ? 'true' : 'false');
    if (v) { chatAttachList(); try { if (matchMedia('(pointer: fine)').matches) $('chat-input').focus(); } catch (e) {} }
  }
  function chatHist() {
    var box = $('chat-histbox'), show = box.hidden;
    if (show) {
      var h = '<h4>Разговоры</h4>';
      var cs = chat.convs.filter(function (c) { return c.msgs.length; }).slice().reverse();
      h += cs.length ? cs.map(function (c) { return '<button type="button" class="hi" data-conv="' + c.id + '">' + esc(c.title || 'Без названия') + '<br><span class="when">' + esc(fmtDt(new Date(c.at).toISOString())) + '</span></button>'; }).join('') : '<p class="when">Пока пусто.</p>';
      h += '<h4>Сохранённые ответы</h4>';
      h += chat.saved.length ? chat.saved.slice().reverse().map(function (s, i) { return '<div class="sv-i">' + esc(s.t) + '<br><button type="button" class="link" data-unsave="' + (chat.saved.length - 1 - i) + '">Убрать</button></div>'; }).join('') : '<p class="when">Нажми звёздочку у ответа, чтобы сохранить его здесь.</p>';
      box.innerHTML = h;
    }
    box.hidden = !show; $('chat-log').hidden = show;
  }
  async function chatAsk(q) {
    q = q.trim();
    if (!q || chatBusy) return;
    var c = chat.cur, att = $('chat-attach').value, it = att ? itemById(att) : null;
    var ctx = it ? 'Задача: «' + it.text + '», статус: ' + STATUS_N[it.status] + (it.due ? ', срок: ' + it.due : '') + '. ' : '';
    chatBusy = true; $('chat-send').disabled = true;
    c.msgs.push({ r: 'me', t: q + (it ? '\n📎 ' + it.text : '') });
    if (!c.title) c.title = q.slice(0, 48);
    if (chat.convs.indexOf(c) < 0) chat.convs.push(c);
    $('chat-input').value = ''; chatGrow();
    var reply = '', err = false;
    if (FIXED_REPLY) reply = FIXED_REPLY;
    else if (!CHAT_API_URL) { reply = 'Помощник ещё не подключён к Claude: нужно добавить адрес сервера в CHAT_API_URL (инструкция в README).'; err = true; }
    else {
      c.msgs.push({ r: 'ai', t: 'Думаю…', err: true }); chatPaint();
      try {
        var msgs = c.msgs.slice(0, -1).slice(-20).map(function (m, i, a) { return { role: m.r === 'me' ? 'user' : 'assistant', content: (i === a.length - 1 ? ctx : '') + m.t }; });
        var r = await fetch(CHAT_API_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ messages: msgs }) });
        if (!r.ok) throw new Error('http ' + r.status);
        var data = await r.json(); if (!data.reply) throw new Error('empty'); reply = data.reply;
      } catch (e) { reply = 'Не получилось получить ответ. Попробуй ещё раз чуть позже.'; err = true; }
      c.msgs.pop();
    }
    c.msgs.push({ r: 'ai', t: reply, err: err });
    chatStore(); chatPaint();
    chatBusy = false; $('chat-send').disabled = false;
  }
  function chatGrow() { var i = $('chat-input'); i.style.height = 'auto'; i.style.height = Math.min(i.scrollHeight, 120) + 'px'; }
  $('chat-form').addEventListener('submit', function (e) { e.preventDefault(); chatAsk($('chat-input').value); });
  $('chat-input').addEventListener('input', chatGrow);
  $('chat-input').addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); chatAsk(this.value); } });
  $('chat-new').addEventListener('click', chatNew);
  $('chat-hist').addEventListener('click', chatHist);
  $('chat-close').addEventListener('click', function () { chatOpen(false); $('chat-btn').focus(); });
  /* ----- автовход на запомненном устройстве ----- */
  try { sessionStorage.removeItem('vexxo:code'); } catch (e) {}
  paintIcons(); paintDots();
  var saved = loadToken();
  // Ссылка из бота: сайт/#k=<билет> открывает аккаунт без ввода пароля. Билет одноразовый.
  var ticket = (/^#k=([0-9a-f]{32,64})$/.exec(location.hash || '') || [])[1] || '';
  async function ticketLogin(t) {
    busyLogin = true; hint.textContent = 'Входим по ссылке…';
    var tok = null, why = '';
    try { tok = await rpc('vx_ticket_use', { p_ticket: t, p_device: deviceLabel() }); }
    catch (e) { why = /site_locked/.test(e.message || '') ? 'Сайт временно закрыт. Попробуй позже.' : /too_many_attempts/.test(e.message || '') ? 'Слишком много попыток. Подожди 5 минут.' : 'Нет связи с сервером. Обнови страницу.'; }
    if (tok) {
      CODE = tok;
      try { await loadData(); saveToken(tok); showApp(); return; }
      catch (e) { CODE = ''; why = 'Нет связи с сервером. Обнови страницу.'; }
    } else if (!why) why = 'Ссылка уже использована или устарела. Войди по паролю или напиши боту /site, чтобы получить новую.';
    busyLogin = false;
    if (/^[0-9a-f]{64}$/.test(saved)) resume(saved); else hint.textContent = why;
  }
  if (ticket) {
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
    ticketLogin(ticket);
  } else if (/^[0-9a-f]{64}$/.test(saved)) resume(saved);
})();
</script>
