<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VEXXO</title>
<meta name="theme-color" content="#0B0B0B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="VEXXO">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: вход по коду; затем шапка (логотип, «Я: Уля/Максим», выход), вкладки Календарь / Уля / Максим, под ними рабочие блоки. Строгий деловой стиль: графит, один синий акцент, тонкие линии, малые радиусы. */
:root {
  --bg: #E8E6E2;
  --surface: #F5F4F1;
  --ink: #0B0B0B;
  --muted: #66655F;
  --line: #CBC9C3;
  --accent: #0B0B0B;
  --on-accent: #FFFFFF;
  --tint: #DCDAD5;
  --ok: #17703F;
  --bad: #B42318;
  --font-sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B0B0B;
    --surface: #141414;
    --ink: #F0EEEA;
    --muted: #8E8D87;
    --line: #2B2B2B;
    --accent: #F0EEEA;
    --on-accent: #0B0B0B;
    --tint: #1C1C1C;
    --ok: #4CC38A;
    --bad: #FF8A80;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B0B0B;
  --surface: #141414;
  --ink: #F0EEEA;
  --muted: #8E8D87;
  --line: #2B2B2B;
  --accent: #F0EEEA;
  --on-accent: #0B0B0B;
  --tint: #1C1C1C;
  --ok: #4CC38A;
  --bad: #FF8A80;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 16px;
  line-height: 1.5;
  padding-block: max(16px, env(safe-area-inset-top, 0px)) 96px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button, input, select, textarea { font: inherit; color: inherit; }
button:focus-visible, a:focus-visible, textarea:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

/* ---------- Вход ---------- */
.lock { min-height: calc(100vh - 120px); display: grid; place-items: center; }
.lock-card { width: min(340px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 0; padding: 28px 22px 22px; text-align: center; display: flex; flex-direction: column; gap: 18px; }
.logo { font-weight: 700; letter-spacing: 0.18em; }
.lock .logo { font-size: 22px; }
.lock p { margin: 0; color: var(--muted); font-size: 15px; }
.dots { display: flex; justify-content: center; gap: 14px; height: 16px; }
.dots i { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--muted); transition: background-color .12s; }
.dots i.on { background: var(--accent); border-color: var(--accent); }
.dots.bad { animation: shake .35s; }
.dots.bad i { border-color: var(--bad); }
@keyframes shake { 20%, 60% { transform: translateX(-7px); } 40%, 80% { transform: translateX(7px); } }
.keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.keys button { height: 54px; border-radius: 0; border: 1px solid var(--line); background: var(--bg); font-size: 20px; cursor: pointer; }
.keys button:hover { border-color: var(--accent); }
.keys button:active { background: var(--tint); }
.keys .blank { visibility: hidden; }
.hint { font-size: 13px; }

/* ---------- Каркас ---------- */
.app { max-width: 960px; margin-inline: auto; display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.top .logo { font-size: 17px; }
.top-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.who { font-size: 14px; color: var(--muted); }
.who strong { color: var(--ink); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 0; overflow: hidden; }
.seg button { border: none; background: var(--surface); padding: 6px 12px; cursor: pointer; font-size: 14px; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); font-weight: 700; }
.exit { border: 1px solid var(--line); background: none; border-radius: 0; padding: 6px 12px; color: var(--muted); cursor: pointer; font-size: 14px; }
.exit:hover { color: var(--ink); border-color: var(--ink); }
.draft { margin: 0; font-size: 13px; color: var(--muted); }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { border: none; background: none; cursor: pointer; padding: 10px 16px; margin-bottom: -1px; border-bottom: 2px solid transparent; color: var(--muted); font-weight: 500; white-space: nowrap; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 700; }

.sub { display: flex; gap: 8px; flex-wrap: wrap; }
.sub button { border: 1px solid var(--line); background: var(--surface); border-radius: 0; padding: 7px 14px; cursor: pointer; font-size: 15px; color: var(--muted); }
.sub button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); font-weight: 700; }

.view { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.view h1 { margin: 0; font-size: clamp(26px, 5vw, 34px); line-height: 1.15; letter-spacing: -0.01em; }
.view h2 { margin: 0; font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.lead { margin: 0; color: var(--muted); max-width: 44em; }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 0; padding: 8px 14px; cursor: pointer; font-size: 15px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 700; }
.btn.small { padding: 5px 10px; font-size: 14px; }
.btn.yes[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: #fff; }
.btn.no[aria-pressed="true"] { background: var(--bad); border-color: var(--bad); color: #fff; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 0; }
.form { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; padding: 14px; align-items: end; }
.form label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); min-width: 0; }
.form .wide { grid-column: 1 / -1; }
.form select { border-radius: 0; }
.form input, .form select { background: var(--bg); border: 1px solid var(--line); border-radius: 0; padding: 9px 10px; min-width: 0; color: var(--ink); }

.ev { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px 16px; padding: 14px 16px; align-items: center; }
.ev + .ev { border-top: 1px solid var(--line); }
.ev h3 { margin: 0; font-size: 17px; overflow-wrap: anywhere; }
.ev .meta { color: var(--muted); font-size: 14px; display: flex; gap: 6px 14px; flex-wrap: wrap; margin-top: 2px; }
.ev .votes { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.badge { font-size: 12px; padding: 2px 8px; border-radius: 0; border: 1px solid var(--line); color: var(--muted); font-family: var(--font-mono); }
.badge.yes { color: var(--ok); border-color: var(--ok); }
.badge.no { color: var(--bad); border-color: var(--bad); }
.day-head { padding: 10px 16px; background: var(--tint); border-bottom: 1px solid var(--line); border-radius: 0; font-size: 14px; font-weight: 700; }
.empty { padding: 20px 16px; color: var(--muted); }
.example { font-size: 12px; color: var(--muted); border: 1px dashed var(--line); padding: 1px 6px; border-radius: 0; margin-left: 6px; font-weight: 400; }

.list { list-style: none; margin: 0; padding: 0; }
.item { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; padding: 12px 16px; align-items: center; }
.item + .item { border-top: 1px solid var(--line); }
.item input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--accent); }
.item.done span.t { text-decoration: line-through; color: var(--muted); }
.item .t { overflow-wrap: anywhere; }
.item .when { color: var(--muted); font-size: 13px; }
.x { border: none; background: none; color: var(--muted); cursor: pointer; font-size: 18px; padding: 2px 8px; }
.x:hover { color: var(--bad); }
.add { display: flex; gap: 8px; flex-wrap: wrap; padding: 12px 16px; border-top: 1px solid var(--line); }
.add input { flex: 1 1 160px; min-width: 0; background: var(--bg); border: 1px solid var(--line); border-radius: 0; padding: 9px 10px; }

.sch-sum { margin: 0; }
.sch-sum strong { font-weight: 700; }
.wk { font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin: 8px 0 -8px; font-weight: 700; }
.dayc { background: var(--surface); border: 1px solid var(--line); border-radius: 0; overflow: hidden; }
.dayc.past { opacity: .55; }
.dayc.today { border-color: var(--accent); }
.dayc header { display: flex; align-items: baseline; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--tint); }
.dayc h3 { margin: 0; font-size: 16px; }
.dayc .date { color: var(--muted); font-size: 13px; font-family: var(--font-mono); }
.dayc .pill { margin-left: auto; background: var(--accent); color: var(--on-accent); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; padding: 2px 8px; border-radius: 0; font-family: var(--font-mono); }
.pair { display: grid; grid-template-columns: 2rem minmax(0, 1fr) auto; gap: 12px; padding: 10px 16px; align-items: center; }
.pair + .pair { border-top: 1px solid var(--line); }
.pair .n { font-family: var(--font-mono); color: var(--muted); border: 1px solid var(--line); border-radius: 0; text-align: center; padding: 2px 0; }
.pair .s { font-weight: 500; overflow-wrap: anywhere; }
.pair .tm { font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
.pair .room { font-family: var(--font-mono); font-size: 13px; background: var(--tint); padding: 3px 8px; border-radius: 0; white-space: nowrap; }
.pair.live { background: var(--tint); }
.pair.live .n { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.pair.done { opacity: .5; }
.flag { color: var(--accent); font-weight: 700; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; margin-left: 6px; font-style: normal; }

.proj { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
.proj .panel { min-width: 0; }
.proj-head { padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.proj-head h3 { margin: 0; font-size: 18px; }
.ver { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; padding: 12px 16px; align-items: center; }
.ver + .ver { border-top: 1px solid var(--line); }
.ver .t { overflow-wrap: anywhere; font-weight: 500; }
.ver .note { grid-column: 1 / -1; color: var(--muted); font-size: 14px; margin-top: -6px; overflow-wrap: anywhere; }
.ver .when { color: var(--muted); font-size: 13px; font-family: var(--font-mono); }
.latest { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--on-accent); background: var(--accent); border-radius: 0; padding: 1px 6px; margin-left: 8px; font-family: var(--font-mono); vertical-align: middle; }
.local-note { font-size: 13px; color: var(--muted); border-left: 2px solid var(--line); padding-left: 10px; margin: 0; }
.foot { color: var(--muted); font-size: 13px; }
.err { margin: 0; padding: 10px 14px; border: 1px solid var(--bad); border-radius: 0; color: var(--bad); background: var(--surface); }
.ver .t a { color: var(--ink); text-decoration-color: var(--accent); text-underline-offset: 3px; }
.ver .t a:hover { color: var(--accent); }

/* ---------- Чат с Claude ---------- */
.chat-fab { position: fixed; z-index: 20; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); font-weight: 700; font-size: 15px; background: var(--accent); color: var(--on-accent); border: none; border-radius: 0; padding: 12px 18px; cursor: pointer; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25); }
.chat-fab[hidden], .chat-panel[hidden] { display: none; }
.chat-panel { position: fixed; z-index: 30; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: min(400px, calc(100vw - 32px)); height: min(560px, calc(100% - 32px - env(safe-area-inset-bottom, 0px))); display: flex; flex-direction: column; min-width: 0; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 0; overflow: hidden; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35); }
.chat-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.chat-head strong { font-size: 16px; }
.chat-head button { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 0; padding: 4px 10px; cursor: pointer; }
.chat-log { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 14px; }
.chat-msg { max-width: 88%; padding: 9px 12px; border-radius: 0; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 15px; }
.chat-msg.ai { align-self: flex-start; background: var(--tint); }
.chat-msg.me { align-self: flex-end; background: var(--accent); color: var(--on-accent); }
.chat-msg.err { color: var(--muted); font-style: italic; }
.chat-form { display: flex; gap: 8px; align-items: flex-end; padding: 10px 12px; border-top: 1px solid var(--line); }
.chat-form textarea { flex: 1; min-width: 0; resize: none; max-height: 120px; line-height: 1.4; background: var(--bg); border: 1px solid var(--line); border-radius: 0; padding: 8px 10px; }
.chat-form button { font-weight: 700; background: var(--accent); color: var(--on-accent); border: none; border-radius: 0; padding: 9px 14px; cursor: pointer; }
.chat-form button:disabled { opacity: 0.5; cursor: default; }

@media (max-width: 520px) { .ev { grid-template-columns: 1fr; } .item { grid-template-columns: auto minmax(0, 1fr) auto; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---------- Стиль: монохромный журнальный (чёрное и тёплый серый, крупный гротеск, капс) ---------- */
.logo { font-weight: 800; letter-spacing: 0.28em; text-transform: uppercase; }
.view h1 { font-size: clamp(38px, 9vw, 88px); font-weight: 800; line-height: 1; letter-spacing: -0.04em; text-transform: uppercase; margin: 8px 0 4px; }
.view h2, .wk { letter-spacing: 0.22em; }
.btn, .exit, .sub button, .tabs button, .chat-fab, .chat-form button, .chat-head button, .seg button { text-transform: uppercase; letter-spacing: 0.12em; font-size: 12px; font-weight: 600; }
.btn { padding: 11px 18px; }
.btn.primary, .chat-fab { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.btn.primary:hover { opacity: .85; }
.exit { padding: 8px 14px; }
.top { border-bottom: 2px solid var(--ink); padding-bottom: 16px; }
.top .logo { font-size: 22px; }
.tabs { gap: 28px; border-bottom: 1px solid var(--line); }
.tabs button { padding: 12px 0; letter-spacing: 0.2em; font-size: 12px; }
.tabs button[aria-selected="true"] { border-bottom-color: var(--ink); }
.sub button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.panel, .dayc, .lock-card { background: var(--surface); }
.day-head, .dayc header { background: var(--ink); color: var(--bg); border-bottom: none; letter-spacing: 0.14em; text-transform: uppercase; font-size: 12px; }
.dayc header .date { color: var(--bg); opacity: .7; }
.proj-head h3, .ev h3, .dayc h3 { text-transform: uppercase; letter-spacing: 0.06em; font-weight: 700; }
.proj-head h3 { font-size: 22px; letter-spacing: 0.02em; }
.latest, .dayc .pill { background: var(--ink); color: var(--bg); }
.dayc.today { border-color: var(--ink); border-width: 2px; }
.pair.live .n { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.item input[type=checkbox] { accent-color: #0B0B0B; }
.dl { color: var(--ink); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; font-size: 12px; text-underline-offset: 3px; }
.chat-msg.me { background: var(--ink); color: var(--bg); }
.chat-form button { background: var(--ink); color: var(--bg); }
.chat-fab { box-shadow: none; border: 1px solid var(--bg); }
.draft { letter-spacing: .08em; text-transform: uppercase; font-size: 11px; }
.dots i.on { background: var(--ink); border-color: var(--ink); }
.keys button { background: transparent; border-color: var(--ink); }
.keys button:hover { background: var(--ink); color: var(--bg); }

/* Экран входа: огромное слово, тёмная полоса с клавиатурой */
body:has(#lock:not([hidden])) { padding: 0; }
.lock { min-height: 100vh; display: flex; flex-direction: column; place-items: initial; }
.lock-bar { background: #0B0B0B; color: #F0EEEA; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; padding: 10px max(16px, env(safe-area-inset-left, 0px)); display: flex; justify-content: space-between; gap: 12px; }
.lock-hero { flex: 1; padding: 6vh max(20px, env(safe-area-inset-left, 0px)) 4vh; display: flex; flex-direction: column; justify-content: center; gap: 18px; }
.lock-tag { font-size: 12px; letter-spacing: .32em; text-transform: uppercase; line-height: 2; margin: 0; }
.lock-word { font-size: clamp(76px, 25vw, 300px); font-weight: 800; line-height: .82; letter-spacing: -0.05em; margin: 0; text-transform: uppercase; }
.lock-card { background: #0B0B0B; color: #F0EEEA; border: none; width: 100%; border-radius: 0; padding: 28px max(20px, env(safe-area-inset-left, 0px)) 34px; align-items: center; }
.lock-card p { color: #A9A8A2; text-transform: uppercase; letter-spacing: .2em; font-size: 12px; }
.lock-card .dots i { border-color: #A9A8A2; }
.lock-card .dots i.on { background: #F0EEEA; border-color: #F0EEEA; }
.lock-card .keys { width: min(340px, 100%); }
.lock-card .keys button { border-color: #4A4A48; color: #F0EEEA; background: transparent; }
.lock-card .keys button:hover, .lock-card .keys button:active { background: #F0EEEA; color: #0B0B0B; }
.lock-card .dots.bad i { border-color: #FF8A80; }

/* ---------- Дополнения: кабинет, правка, чертежи, расписание ---------- */
.keys .ok { font-size: 14px; letter-spacing: .14em; font-weight: 600; }
.dots { flex-wrap: wrap; row-gap: 8px; min-height: 16px; height: auto; }
.acts { display: inline-flex; gap: 2px; }
.ev.one, .item.one { display: block; }
.edit-form { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; width: 100%; }
.edit-form input { flex: 1 1 140px; min-width: 0; background: var(--bg); border: 1px solid var(--line); border-radius: 0; padding: 9px 10px; }
.edit-form input[name="t"] { flex: 2 1 220px; }
.panel-h { margin: 0; padding: 14px 16px 0; font-size: 13px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
.panel-b { padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
.panel-b p { margin: 0; color: var(--muted); }
.form-msg { margin: 0; min-height: 1.5em; color: var(--muted); font-size: 14px; grid-column: 1 / -1; }
.pair-r { display: inline-flex; align-items: center; gap: 6px; }
.search { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 0; padding: 11px 12px; }
.dgroup { padding: 14px 16px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.dgroup[hidden] { display: none; }
.dg-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.dg-head h4 { margin: 0; font-size: 17px; text-transform: uppercase; letter-spacing: .04em; overflow-wrap: anywhere; }
.dg-head .latest { margin-left: 0; flex: none; }
.dg-meta { color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
.dg-acts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.dg-acts .btn { text-decoration: none; color: inherit; }
.prev { display: block; max-width: 100%; max-height: 260px; object-fit: contain; border: 1px solid var(--line); background: var(--bg); }
.pdfbox iframe { width: 100%; height: 420px; border: 1px solid var(--line); background: #fff; }
.older { border-top: 1px dashed var(--line); padding-top: 8px; }
.older summary { cursor: pointer; color: var(--muted); font-size: 14px; }
.older .ver { padding: 8px 0 0; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
@media (max-width: 440px) { .tabs { gap: 16px; } .tabs button { letter-spacing: .12em; padding-inline: 0; } }

/* ---------- Админ ---------- */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); }
.stat { background: var(--surface); padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat span { color: var(--muted); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; font-weight: 600; }
.stat b { font-size: 30px; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; }
.stat small { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.kvs { margin: 0; padding: 4px 16px 14px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 8px 16px; font-size: 15px; }
.kvs + .kvs { border-top: 1px solid var(--line); padding-top: 14px; }
.kvs dt { color: var(--muted); overflow-wrap: anywhere; }
.kvs dd { margin: 0; text-align: right; font-family: var(--font-mono); font-size: 14px; overflow-wrap: anywhere; }
.banner { padding: 12px 16px; background: var(--ink); color: var(--bg); border: 1px solid var(--ink); font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; width: 100%; }
.banner.ok { background: transparent; color: var(--ink); }
.bar { width: 100%; height: 8px; border: 1px solid var(--line); background: var(--tint); }
.bar i { display: block; height: 100%; background: var(--ink); }
.adm-msg { margin: 0; min-height: 1.5em; color: var(--muted); font-size: 14px; }
.opt { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; cursor: pointer; }
.opt + .opt { border-top: 1px solid var(--line); }
.opt input { width: 22px; height: 22px; accent-color: #0B0B0B; flex: none; }
.lr { display: grid; grid-template-columns: 6.4rem minmax(0, 1fr); gap: 2px 12px; padding: 10px 16px; font-size: 14px; }
.lr + .lr { border-top: 1px solid var(--line); }
.lr time { font-family: var(--font-mono); color: var(--muted); font-size: 13px; }
.lr .d { color: var(--muted); overflow-wrap: anywhere; }
.btn.danger { border-color: var(--bad); color: var(--bad); }
.btn[data-armed] { background: var(--bad); border-color: var(--bad); color: #fff; }
.acts-row { display: flex; gap: 8px; flex-wrap: wrap; }
.ses { display: flex; justify-content: space-between; gap: 12px; padding: 10px 16px; font-size: 14px; flex-wrap: wrap; }
.ses + .ses { border-top: 1px solid var(--line); }
.ses span:last-child { color: var(--muted); font-family: var(--font-mono); font-size: 13px; }
</style>

<body>

<div class="lock" id="lock">
  <div class="lock-bar"><span>Рабочее пространство</span><span>Только для своих</span></div>
  <div class="lock-hero">
    <p class="lock-tag">Планы, задачи<br>и чертежи<br>в одном месте.</p>
    <h1 class="lock-word">VEXXO</h1>
  </div>
  <div class="lock-card">
    <p>Вход по личному коду</p>
    <div class="dots" id="dots" aria-hidden="true"></div>
    <div class="keys" id="keys" role="group" aria-label="Цифровая клавиатура">
      <button type="button" data-k="1">1</button><button type="button" data-k="2">2</button><button type="button" data-k="3">3</button>
      <button type="button" data-k="4">4</button><button type="button" data-k="5">5</button><button type="button" data-k="6">6</button>
      <button type="button" data-k="7">7</button><button type="button" data-k="8">8</button><button type="button" data-k="9">9</button>
      <button type="button" data-k="ok" class="ok" aria-label="Войти">ОК</button>
      <button type="button" data-k="0">0</button>
      <button type="button" data-k="back" aria-label="Стереть">⌫</button>
    </div>
    <p class="hint" id="hint" aria-live="polite">Введи свой код</p>
  </div>
</div>

<div class="app" id="app" hidden>
  <header class="top">
    <div class="logo">VEXXO</div>
    <div class="top-right">
      <span class="who">Вы вошли как <strong id="me-name"></strong></span>
      <button type="button" class="exit" id="exit">Выйти</button>
    </div>
  </header>
  <nav class="tabs" role="tablist" aria-label="Разделы" id="tabs">
    <button type="button" role="tab" data-v="cal" aria-selected="true">Календарь</button>
    <button type="button" role="tab" data-v="ulya" aria-selected="false">Уля</button>
    <button type="button" role="tab" data-v="maxim" aria-selected="false">Максим</button>
    <button type="button" role="tab" data-v="me" aria-selected="false">Кабинет</button>
    <button type="button" role="tab" data-v="admin" aria-selected="false" hidden>Админ</button>
  </nav>
  <main class="view" id="view" aria-live="polite"></main>
  <p class="err" id="err" role="alert" hidden></p>
</div>

<button type="button" class="chat-fab" id="chat-fab" hidden aria-controls="chat-panel" aria-expanded="false">Спросить Claude</button>
<section class="chat-panel" id="chat-panel" hidden aria-label="Чат с Claude">
  <div class="chat-head"><strong>Чат с Claude</strong><span><button type="button" id="chat-new">Новый</button> <button type="button" id="chat-close" aria-label="Закрыть чат">✕</button></span></div>
  <div class="chat-log" id="chat-log" aria-live="polite"></div>
  <form class="chat-form" id="chat-form">
    <textarea id="chat-input" rows="1" maxlength="2000" placeholder="Напиши вопрос…" aria-label="Вопрос"></textarea>
    <button type="submit" id="chat-send">Отправить</button>
  </form>
</section>

<script>
(function () {
  // Подключение к базе Supabase. Ключ publishable публичный, его можно держать в коде сайта.
  // Права ограничены: к таблицам напрямую доступа нет, всё идёт через функции, которые проверяют код входа.
  var SB_URL = 'https://cnkergfsrmvvvbsubqnv.supabase.co';
  var SB_KEY = 'sb_publishable_y_PN61X0Fnrupm3tuKU5sQ_uStCwgok';
  var MAX_FILE = 25 * 1024 * 1024;

  var SKEY = 'vexxo:session';
  var NAMES = { ulya: 'Уля', maxim: 'Максим' };
  var DAYN = ['Воскресенье', 'Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница', 'Суббота'];
  var DAYS = ['вс', 'пн', 'вт', 'ср', 'чт', 'пт', 'сб'];
  var MONTHS = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
  var PAIR_TIMES = { 1: ['08:30', '10:00'], 2: ['10:15', '11:45'], 3: ['12:30', '14:00'], 4: ['14:15', '15:45'], 5: ['16:00', '17:30'], 6: ['18:00', '19:30'] };
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function uuid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    var b = new Uint8Array(16); crypto.getRandomValues(b); b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128;
    var h = Array.prototype.map.call(b, function (x) { return ('0' + x.toString(16)).slice(-2); }).join('');
    return h.slice(0, 8) + '-' + h.slice(8, 12) + '-' + h.slice(12, 16) + '-' + h.slice(16, 20) + '-' + h.slice(20);
  }

  /* ----- связь с сервером ----- */
  function rpc(fn, args) {
    return fetch(SB_URL + '/rest/v1/rpc/' + fn, {
      method: 'POST',
      headers: { 'apikey': SB_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify(args)
    }).then(function (r) {
      return r.text().then(function (t) {
        if (!r.ok) { var e = new Error(t || ('http ' + r.status)); e.status = r.status; throw e; }
        return t ? JSON.parse(t) : null;
      });
    });
  }

  var CODE = '';
  var state = { me: '', raw: null, schedule: [], trash: [], events: [], plans: { ulya: [], maxim: [] }, tasks: { ulya: [], maxim: [] }, drawings: { sapr: [], arch: [] } };
  var lastSig = '';

  function fileUrl(path) { return SB_URL + '/storage/v1/object/public/drawings/' + path; }
  function applyData(d) {
    state.me = d.me;
    state.events = (d.events || []).map(function (e) {
      var v = e.votes || {};
      return { id: e.id, title: e.title, date: e.date, time: String(e.time).slice(0, 5), by: e.by, votes: { ulya: v.ulya || '', maxim: v.maxim || '' } };
    });
    state.plans = { ulya: [], maxim: [] }; state.tasks = { ulya: [], maxim: [] };
    (d.items || []).forEach(function (i) {
      (i.kind === 'plan' ? state.plans : state.tasks)[i.owner].push({ id: i.id, text: i.text, when: i.when || '', done: !!i.done, date: i.date || '', time: i.time ? String(i.time).slice(0, 5) : '', by: i.by || i.owner });
    });
    state.schedule = d.schedule || []; state.trash = d.trash || []; state.raw = d;
    state.drawings = { sapr: [], arch: [] };
    (d.files || []).forEach(function (f) {
      if (state.drawings[f.project]) state.drawings[f.project].push({ id: f.id, title: f.title, date: f.date, note: f.note || '', filename: f.filename || '', url: fileUrl(f.path) });
    });
  }
  async function loadData() {
    var d = await rpc('vx_load', { p_code: CODE });
    if (!d || d.error) { var e = new Error('forbidden'); e.forbidden = true; throw e; }
    lastSig = JSON.stringify(d);
    state.me = d.me;
    applyData(d);
    if (state.me === 'maxim') cleanTrash();
  }

  var errEl = $('err');
  function showErr(e) {
    var m = 'Нет связи с сервером. Попробуй ещё раз.';
    if (e && e.forbidden) m = 'Вход устарел. Выйди и войди заново.';
    else if (e && e.message === 'size') m = 'Файл больше 25 МБ.';
    else if (e && e.message === 'upload') m = 'Не удалось загрузить файл. Попробуй ещё раз.';
    else if (e && /too_many_attempts/.test(e.message || '')) m = 'Слишком много неверных кодов. Подожди 5 минут.';
    else if (e && /site_locked/.test(e.message || '')) m = 'Сайт временно закрыт. Попробуй позже.';
    else if (e && e.status === 404) m = 'В базе нет нужной функции. Нужно применить supabase/migration-5.sql.';
    errEl.textContent = m; errEl.hidden = false;
  }
  async function act(fn) {
    try { await fn(); await loadData(); errEl.hidden = true; } catch (e) { showErr(e); }
    render();
  }

  /* ----- время ----- */
  function moscowNow() {
    var parts = new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/Moscow', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).formatToParts(new Date());
    function g(t) { for (var i = 0; i < parts.length; i++) if (parts[i].type === t) return parts[i].value; return '0'; }
    return { date: g('year') + '-' + g('month') + '-' + g('day'), minutes: parseInt(g('hour'), 10) * 60 + parseInt(g('minute'), 10) };
  }
  function toMin(s) { var p = s.split(':'); return parseInt(p[0], 10) * 60 + parseInt(p[1], 10); }
  function dow(iso) { return new Date(iso + 'T12:00:00Z').getUTCDay(); }
  function longDate(iso) { var p = iso.split('-'); return parseInt(p[2], 10) + ' ' + MONTHS[parseInt(p[1], 10) - 1]; }
  function shortDate(iso) { var p = iso.split('-'); return p[2] + '.' + p[1]; }
  function mondayOf(iso) { var d = new Date(iso + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() - ((d.getUTCDay() + 6) % 7)); return d.toISOString().slice(0, 10); }
  function pl(n, a, b, c) { var m10 = n % 10, m100 = n % 100; if (m10 === 1 && m100 !== 11) return a; if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return b; return c; }

  /* ----- вход ----- */
  // Код вводится один раз: сервер выдаёт токен на 30 дней, он хранится только на этом устройстве. Сам код нигде не сохраняется.
  var entered = '', busyLogin = false;
  var lock = $('lock'), app = $('app'), dots = $('dots'), hint = $('hint'), fab = $('chat-fab');
  var HINT0 = 'Введи свой код и нажми ОК';
  function paintDots() {
    var n = Math.max(4, entered.length), h = '';
    for (var i = 0; i < n; i++) h += '<i' + (i < entered.length ? ' class="on"' : '') + '></i>';
    dots.innerHTML = h;
  }
  function badCode(msg) {
    hint.textContent = msg;
    dots.classList.remove('bad'); void dots.offsetWidth; dots.classList.add('bad');
    setTimeout(function () { entered = ''; paintDots(); busyLogin = false; }, 350);
  }
  function saveToken(t) { try { localStorage.setItem(SKEY, t); } catch (e) {} }
  function loadToken() { try { return localStorage.getItem(SKEY) || ''; } catch (e) { return ''; } }
  function dropToken() { try { localStorage.removeItem(SKEY); } catch (e) {} }
  function showApp() {
    entered = ''; paintDots(); busyLogin = false; hint.textContent = HINT0;
    lock.hidden = true; app.hidden = false; fab.hidden = false;
    paintMe(); go(fromHash() || 'cal');
  }
  // Короткое название устройства для журнала входов (например «iPhone Safari»).
  function deviceLabel() {
    var u = navigator.userAgent || '';
    var os = /iPhone/.test(u) ? 'iPhone' : /iPad/.test(u) ? 'iPad' : /Android/.test(u) ? 'Android' : /Windows/.test(u) ? 'Windows' : /Mac OS X|Macintosh/.test(u) ? 'Mac' : /Linux/.test(u) ? 'Linux' : 'Устройство';
    var br = /Edg\//.test(u) ? 'Edge' : /OPR\/|Opera/.test(u) ? 'Opera' : /YaBrowser/.test(u) ? 'Яндекс' : /Firefox|FxiOS/.test(u) ? 'Firefox' : /CriOS|Chrome/.test(u) ? 'Chrome' : /Safari/.test(u) ? 'Safari' : '';
    var pwa = false; try { pwa = !!(navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches)); } catch (e) {}
    return (os + ' ' + br + (pwa ? ' (экран «Домой»)' : '')).replace(/\s+/g, ' ').trim();
  }
  var LOCKED_HINT = 'Сайт временно закрыт. Зайдёт сам, когда откроют.';
  var lockRetry = 0;
  async function tryLogin(c) {
    busyLogin = true;
    var tok;
    try { tok = await rpc('vx_session_start', { p_code: c, p_device: deviceLabel() }); }
    catch (e) { return badCode(/too_many_attempts/.test(e.message || '') ? 'Слишком много попыток. Подожди 5 минут.' : /site_locked/.test(e.message || '') ? 'Сайт временно закрыт. Попробуй позже.' : 'Нет связи с сервером. Попробуй ещё раз.'); }
    if (!tok) return badCode('Неверный код, попробуй ещё раз');
    CODE = tok;
    try { await loadData(); } catch (e) { CODE = ''; return badCode('Нет связи с сервером. Попробуй ещё раз.'); }
    saveToken(tok);
    showApp();
  }
  async function resume(tok) {
    busyLogin = true; hint.textContent = 'Входим…'; CODE = tok;
    try { await loadData(); }
    catch (e) {
      CODE = '';
      if (e && e.forbidden) dropToken();
      busyLogin = false;
      if (e && /site_locked/.test(e.message || '')) { hint.textContent = LOCKED_HINT; clearTimeout(lockRetry); lockRetry = setTimeout(function () { if (!lock.hidden && !busyLogin) resume(tok); }, 20000); return; }
      hint.textContent = e && e.forbidden ? HINT0 : 'Нет связи с сервером. Обнови страницу.';
      return;
    }
    clearTimeout(lockRetry);
    showApp();
  }
  function press(k) {
    if (busyLogin) return;
    if (k === 'back') entered = entered.slice(0, -1);
    else if (k === 'ok') { if (entered.length >= 4) tryLogin(entered); return; }
    else if (entered.length < 12) entered += k;
    paintDots();
  }
  $('keys').addEventListener('click', function (e) { var b = e.target.closest('button[data-k]'); if (b) press(b.getAttribute('data-k')); });
  document.addEventListener('keydown', function (e) {
    if (lock.hidden) return;
    if (/^[0-9]$/.test(e.key)) press(e.key); else if (e.key === 'Backspace') press('back'); else if (e.key === 'Enter') press('ok');
  });
  function leave(keep) {
    if (!keep) dropToken();
    CODE = ''; state.me = ''; state.raw = null;
    app.hidden = true; lock.hidden = false; fab.hidden = true; $('chat-panel').hidden = true;
    entered = ''; paintDots(); hint.textContent = HINT0;
  }
  $('exit').addEventListener('click', function () {
    var t = CODE; leave();
    if (t) rpc('vx_logout', { p_session: t }).catch(function () {});
  });
  function paintMe() {
    $('me-name').textContent = NAMES[state.me] || '';
    $('tabs').querySelector('[data-v="admin"]').hidden = state.me !== 'maxim';
  }

  /* ----- навигация ----- */
  var view = 'cal', sub = { ulya: 'plans', maxim: 'plans' };
  function fromHash() { var h = (location.hash || '').replace('#', ''); return (h === 'cal' || h === 'me' || NAMES[h] || (h === 'admin' && state.me === 'maxim')) ? h : ''; }
  function go(v) {
    if (v === 'admin' && state.me !== 'maxim') v = 'cal';
    view = v;
    var b = $('tabs').querySelectorAll('button');
    for (var i = 0; i < b.length; i++) b[i].setAttribute('aria-selected', b[i].getAttribute('data-v') === v ? 'true' : 'false');
    try { history.replaceState(null, '', '#' + v); } catch (e) {}
    render();
  }
  $('tabs').addEventListener('click', function (e) { var b = e.target.closest('button[data-v]'); if (b) go(b.getAttribute('data-v')); });

  /* ----- календарь ----- */
  function statusBadge(ev, who) {
    var v = ev.votes[who];
    var t = v === 'yes' ? (who === 'ulya' ? 'согласна' : 'согласен') : v === 'no' ? 'отказ' : 'ждёт';
    return '<span class="badge ' + (v || '') + '">' + NAMES[who] + ': ' + t + '</span>';
  }
  var editing = '';
  function editHtml(kind, id, title, date, time, dated) {
    return '<form class="edit-form" data-edit-form="' + kind + '" data-id="' + id + '" data-dated="' + (dated ? '1' : '') + '">' +
      '<input name="t" required maxlength="' + (kind === 'event' ? 120 : 200) + '" value="' + esc(title) + '" aria-label="Название">' +
      (dated ? '<input name="d" type="date" required value="' + esc(date) + '" aria-label="Дата"><input name="h" type="time" required value="' + esc(time) + '" aria-label="Время">' : '') +
      '<button class="btn small primary" type="submit">Сохранить</button><button class="btn small" type="button" data-edit-cancel>Отмена</button></form>';
  }
  function renderCal() {
    var now = moscowNow();
    var entries = [];
    state.events.forEach(function (e) { entries.push({ date: e.date, time: e.time, ev: e }); });
    ['ulya', 'maxim'].forEach(function (w) {
      state.plans[w].forEach(function (p) { if (p.date && !p.done) entries.push({ date: p.date, time: p.time, plan: p, owner: w }); });
    });
    entries.sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : a.time < b.time ? -1 : a.time > b.time ? 1 : 0; });
    var groups = {}, order = [];
    entries.forEach(function (x) { if (!groups[x.date]) { groups[x.date] = []; order.push(x.date); } groups[x.date].push(x); });
    var yesL = state.me === 'ulya' ? 'Согласна' : 'Согласен';
    var h = '<h1>Общий календарь</h1>' +
      '<p class="lead">Предложи время и занятие. Второй человек нажимает «' + yesL + '» или «Отказаться». Планы по времени с личных страниц тоже показаны здесь.</p>' +
      '<form class="panel form" id="ev-form"><label class="wide">Что планируем<input id="ev-title" required maxlength="120" placeholder="Например: прогулка, кино, совместная работа"></label>' +
      '<label>Дата<input id="ev-date" type="date" required value="' + now.date + '"></label>' +
      '<label>Время<input id="ev-time" type="time" required value="18:00"></label>' +
      '<button type="submit" class="btn primary">Предложить</button></form>';
    if (!order.length) h += '<div class="panel empty">Пока ничего не запланировано.</div>';
    order.forEach(function (d) {
      h += '<section class="panel"><div class="day-head">' + DAYN[dow(d)] + ', ' + longDate(d) + (d === now.date ? ' · сегодня' : '') + '</div>';
      groups[d].forEach(function (x) {
        if (x.plan) {
          var p = x.plan;
          h += '<div class="ev plan"><div><h3>' + esc(p.text) + '</h3><div class="meta"><span class="mono">' + esc(p.time) + '</span><span>план: ' + NAMES[x.owner] + '</span>' +
            (p.by !== x.owner ? '<span>добавил' + (p.by === 'ulya' ? 'а' : '') + ': ' + NAMES[p.by] + '</span>' : '') + '</div></div><div class="votes"><span class="badge">план</span></div></div>';
          return;
        }

  async function uploadFile(file) {
    if (file.size > MAX_FILE) throw new Error('size');

    var path = await rpc('vx_file_prepare', { p_code: CODE, p_filename: file.name });
    if (!path) throw new Error('upload');
    var r = await fetch(SB_URL + '/storage/v1/object/drawings/' + path, {
      method: 'POST',
      headers: { 'apikey': SB_KEY, 'Content-Type': file.type || 'application/octet-stream', 'x-upsert': 'false' },
      body: file
    });
    if (!r.ok) throw new Error('upload');
    return path;
  }

        if (r.ok || r.status === 404) await rpc('vx_trash_done', { p_code: CODE, p_path: list[i] });
      } catch (e) {}
    }
    state.trash = [];
    cleaning = false;
  }

  /* --- Данные: все записи обоих людей, из уже загруженного состояния --- */

    h += '<section class="panel"><h2 class="panel-h">Какие уведомления слать</h2>' +
      TG_FLAGS.map(function (t) { return '<label class="opt"><span>' + t[1] + '</span><input type="checkbox" data-flag="' + t[0] + '"' + (fl[t[0]] === false ? '' : ' checked') + '></label>'; }).join('') + '</section>';
    h += '<section class="panel"><h2 class="panel-h">Запустить сейчас</h2><div class="panel-b"><p>Сводка приходит только тебе. Напоминания уходят тем, у кого событие или план начинается в ближайший час.</p><div class="acts-row">' +
      '<button type="button" class="btn" data-a="run" data-arg="digest">Прислать мне сводку</button><button type="button" class="btn" data-a="run" data-arg="remind">Разослать напоминания</button></div></div></section>';
    h += '<section class="panel"><h2 class="panel-h">Написать от сайта</h2><form class="form" id="tg-form">' +
      '<label>Кому<select id="tg-to"><option value="ulya">Уле</option><option value="maxim">Мне</option></select></label>' +
      '<label class="wide">Текст<input id="tg-text" required maxlength="500" placeholder="Например: заходи на сайт, я добавил план"></label>' +
      '<button type="submit" class="btn primary">Отправить</button></form></section>';
    return h;
  }

  /* --- Журнал действий --- */
  function admLog(rows) {
    rows = rows || [];
    var chips = [['', 'Все'], ['ulya', 'Уля'], ['maxim', 'Максим']];
    var h = '<div class="sub" id="lsub">' + chips.map(function (c) { return '<button type="button" data-lw="' + c[0] + '" aria-pressed="' + (logWho === c[0]) + '">' + c[1] + '</button>'; }).join('') + '</div><section class="panel">';
    var shown = rows.filter(function (r) { return !logWho || r.who === logWho; });
    if (!shown.length) h += '<div class="empty">Записей нет.</div>';
    shown.forEach(function (r) {
      h += '<div class="lr"><time>' + esc(fmtDt(r.at)) + '</time><div>' + esc(NAMES[r.who] || r.who || '—') + ': ' + esc(LOG_ACTIONS[r.action] || r.action) + (r.detail ? '<div class="d">' + esc(r.detail) + '</div>' : '') + '</div></div>';
    });
    return h + '</section><p class="local-note">Хранятся последние 120 дней. Показаны последние 200 действий.</p>';
  }

  /* --- обработчики --- */
  function armed(btn) {
    if (!btn.hasAttribute('data-confirm')) return true;
    if (btn.hasAttribute('data-armed')) return true;
    btn.setAttribute('data-armed', '1'); btn.setAttribute('data-old', btn.textContent); btn.textContent = 'Точно? Нажми ещё раз';
    setTimeout(function () { if (btn.isConnected && btn.hasAttribute('data-armed')) { btn.removeAttribute('data-armed'); btn.textContent = btn.getAttribute('data-old'); } }, 4000);
    return false;
  }
  async function waitClean() { for (var i = 0; i < 100 && cleaning; i++) await sleep(150); }
  async function admClick(e) {
    var ds = e.target.closest('[data-ds]'), lw = e.target.closest('[data-lw]'), di = e.target.closest('[data-adm-del]'), b = e.target.closest('[data-a]');
    if (ds) { dsub = ds.getAttribute('data-ds'); editing = ''; $('adm-body').innerHTML = admData(); return; }
    if (lw) { logWho = lw.getAttribute('data-lw'); $('adm-body').innerHTML = admLog(admCache.log); return; }
    if (di) { act(function () { return rpc('vx_item_del', { p_code: CODE, p_id: di.getAttribute('data-adm-del') }); }); return; }
    if (!b || b.disabled || !armed(b)) return;
    var a = b.getAttribute('data-a'), arg = b.getAttribute('data-arg'), r;
    b.disabled = true;
    try {
      if (a === 'lock' || a === 'unlock') { await arpc('vx_admin_lock', { p_on: a === 'lock' }); await loadAdmin(); admSay(a === 'lock' ? 'Сайт закрыт для Ули.' : 'Сайт открыт.'); }
      else if (a === 'kick') { r = await arpc('vx_admin_kick', {}); await loadAdmin(); admSay('Закрыто устройств Ули: ' + (r || 0) + '.'); }
      else if (a === 'purge') {
        r = await arpc('vx_admin_purge', { p_what: arg }); await loadData(); render();
        admSay(r >= 0 ? 'Удалено записей: ' + r + '.' : 'Не получилось.');
      } else if (a === 'clean') {
        r = await arpc('vx_admin_clean_orphans', {}); await loadData(); await waitClean(); await loadAdmin();
        admSay('Лишних файлов стёрто: ' + (r || 0) + '.');
      } else if (a === 'backup') {
        r = await arpc('vx_admin_backup', {});
        downloadJson('vexxo-backup-' + moscowNow().date + '.json', r); admSay('Копия скачана.');
      } else if (a === 'run') {
        await arpc('vx_admin_run', { p_job: arg });
        admSay(arg === 'digest' ? 'Сводка отправлена. Проверь Telegram.' : 'Напоминания разосланы (если было кому).');
      } else if (a === 'tg-test') {
        admSay('Отправляю…');
        var rid = await arpc('vx_admin_tg', { p_to: 'maxim', p_text: 'Проверка связи: сайт VEXXO → Telegram' });
        if (!rid) { admSay('Не отправлено: нет токена бота или chat_id.'); }
        else {
          var res = 'Ответа от Telegram пока нет. Проверь сообщение через минуту.';
          for (var i = 0; i < 8; i++) {
            await sleep(1500);
            var st = await arpc('vx_admin_tg_status', { p_id: rid });
            if (st.state === 'ok') { res = 'Telegram принял сообщение (код ' + st.status + '). Оно должно быть в чате.'; break; }
            if (st.state === 'fail') { res = 'Telegram отказал: ' + (st.status || st.error || 'ошибка') + ' ' + String(st.body || '').slice(0, 120); break; }
          }
          admSay(res);
        }
      }
    } catch (err) {
      admSay(err && err.forbidden ? 'Нет доступа. Выйди и войди заново.' : 'Не получилось: ' + (/site_locked|Failed to fetch/.test(err.message || '') ? 'нет связи.' : 'ошибка сервера.'));
    }
    if (b.isConnected) { b.disabled = false; b.removeAttribute('data-armed'); if (b.getAttribute('data-old')) b.textContent = b.getAttribute('data-old'); }
  }
  async function admChange(e) {
    var chk = e.target.closest('[data-adm-chk]'), fl = e.target.closest('[data-flag]'), mu = e.target.closest('[data-mute]');
    if (mu) {
      var recv = mu.checked;
      try { await arpc('vx_admin_set', { p_key: 'tg_mute_' + mu.getAttribute('data-mute'), p_on: !recv }); admSay(recv ? 'Сообщения включены.' : 'Сообщения отключены.'); }
      catch (err) { mu.checked = !recv; admSay('Не удалось сохранить.'); }
      return;
    }
    if (chk) { var done = chk.checked; act(function () { return rpc('vx_item_set', { p_code: CODE, p_id: chk.getAttribute('data-adm-chk'), p_done: done }); }); return; }
    if (fl) {
      var on = fl.checked;
      try { await arpc('vx_admin_set', { p_key: 'tg_' + fl.getAttribute('data-flag'), p_on: on }); admSay('Сохранено.'); }
      catch (err) { fl.checked = !on; admSay('Не удалось сохранить.'); }
    }
  }
  async function admSubmit(e) {
    var f = e.target;
    if (f.id === 'rc-form') {
      e.preventDefault();
      var nw = $('rc-new').value.trim(), msg = $('rc-msg');
      if (!/^[0-9]{6,12}$/.test(nw)) { msg.textContent = 'Код: от 6 до 12 цифр.'; return; }
      msg.textContent = 'Сохраняем…';
      try {
        var r = await arpc('vx_admin_reset_code', { p_new: nw });
        msg.textContent = r === 'ok' ? 'Готово: код Ули изменён, её устройства вышли. Передай ей новый код.' :
          r === 'taken' ? 'Этот код совпадает с твоим, выбери другой.' : r === 'bad_new' ? 'Код: от 6 до 12 цифр.' : 'Не получилось.';
        if (r === 'ok') $('rc-new').value = '';
      } catch (err) { msg.textContent = 'Нет связи с сервером.'; }
    } else if (f.id === 'tg-form') {
      e.preventDefault();
      var txt = $('tg-text').value.trim(); if (!txt) return;
      try {
        var rid = await arpc('vx_admin_tg', { p_to: $('tg-to').value, p_text: txt });
        admSay(rid ? 'Отправлено.' : 'Не отправлено: нет токена бота или chat_id.');
        if (rid) $('tg-text').value = '';
      } catch (err) { admSay('Нет связи с сервером.'); }
    }
  }

  // Скачивание: файл забирается и сохраняется под своим именем (заголовок «скачать» хранилище не отдаёт). Если не вышло, открываем ссылку.
  async function saveFile(a) {
    var url = a.getAttribute('data-dl'), name = a.getAttribute('data-name') || 'file', old = a.textContent;
    a.textContent = 'Скачиваю…';
    try {
      var r = await fetch(url); if (!r.ok) throw new Error('http');
      var b = await r.blob(), u = URL.createObjectURL(b), x = document.createElement('a');
      x.href = u; x.download = name; document.body.appendChild(x); x.click(); x.remove();
      setTimeout(function () { URL.revokeObjectURL(u); }, 5000);
    } catch (err) { window.open(url, '_blank', 'noopener'); }
    a.textContent = old;
  }
  function render() {
    if (view === 'cal') renderCal(); else if (view === 'me') renderMe(); else if (view === 'admin') renderAdmin(); else renderPerson(view);
  }
  $('view').addEventListener('click', function (e) {
    var v = e.target.closest('[data-vote]'), d = e.target.closest('[data-del-ev]'), dr = e.target.closest('[data-del-dr]'),
        sc = e.target.closest('[data-del-sc]'), ed = e.target.closest('[data-edit]'), ec = e.target.closest('[data-edit-cancel]'), pv = e.target.closest('[data-prev]');
    var dl = e.target.closest('[data-dl]');
    if (dl) { e.preventDefault(); saveFile(dl); return; }
    if (pv) {
      var box = pv.parentNode.parentNode.querySelector('.pdfbox');
      if (box.hidden) { box.innerHTML = '<iframe title="Просмотр" loading="lazy" src="' + esc(pv.getAttribute('data-prev')) + '"></iframe>'; box.hidden = false; pv.textContent = 'Скрыть'; }
      else { box.hidden = true; box.innerHTML = ''; pv.textContent = 'Просмотр'; }
    } else if (ed) { editing = ed.getAttribute('data-edit'); render(); }
    else if (ec) { editing = ''; render(); }
    else if (dr) {
      act(function () { return rpc('vx_file_del', { p_code: CODE, p_id: dr.getAttribute('data-del-dr') }); });
    } else if (sc) {
      act(function () { return rpc('vx_sched_del', { p_code: CODE, p_id: sc.getAttribute('data-del-sc') }); });
    } else if (v) {
      var id = v.getAttribute('data-id'), val = v.getAttribute('data-vote');
      var cur = ''; state.events.forEach(function (ev) { if (ev.id === id) cur = ev.votes[state.me]; });
      act(function () { return rpc('vx_event_vote', { p_code: CODE, p_id: id, p_vote: cur === val ? '' : val }); });
    } else if (d) {
      act(function () { return rpc('vx_event_del', { p_code: CODE, p_id: d.getAttribute('data-del-ev') }); });
    }
  });
  $('view').addEventListener('submit', function (e) {
    var f = e.target.closest('[data-edit-form]'); if (!f) return;
    e.preventDefault();
    var kind = f.getAttribute('data-edit-form'), id = f.getAttribute('data-id'), dated = !!f.getAttribute('data-dated');
    var t = f.elements.t.value.trim(); if (!t) return;
    var dd = dated ? f.elements.d.value : null, hh = dated ? f.elements.h.value : null;
    editing = '';
    if (kind === 'event') act(function () { return rpc('vx_event_edit', { p_code: CODE, p_id: id, p_title: t, p_day: dd, p_time: hh }); });
    else act(function () { return rpc('vx_item_edit', { p_code: CODE, p_id: id, p_body: t, p_day: dd, p_time: hh }); });
  });

  /* ----- обновление раз в 5 секунд и при возвращении на вкладку ----- */
  async function refresh() {
    if (app.hidden || document.visibilityState !== 'visible' || !CODE) return;
    var ae = document.activeElement;
    if (ae && /INPUT|SELECT|TEXTAREA/.test(ae.tagName) && $('view').contains(ae)) return;
    try {
      var d = await rpc('vx_load', { p_code: CODE });
      if (!d) return;
      if (d.error) { dropToken(); leave(); hint.textContent = 'Вход устарел. Введи код заново.'; return; }
      var sig = JSON.stringify(d);
      if (sig !== lastSig) { lastSig = sig; state.me = d.me; applyData(d); render(); if (state.me === 'maxim') cleanTrash(); }
      errEl.hidden = true;
    } catch (e) {
      if (e && /site_locked/.test(e.message || '')) {
        var t = CODE; leave(true); hint.textContent = LOCKED_HINT;
        clearTimeout(lockRetry); lockRetry = setTimeout(function () { if (!lock.hidden && !busyLogin) resume(t); }, 20000);
        return;
      }
    }
    if (view !== 'cal' && view !== 'me' && view !== 'admin' && sub[view] === 'sched') render();
  }
  setInterval(refresh, 5000);
  document.addEventListener('visibilitychange', refresh);
  window.addEventListener('focus', refresh);

  /* ----- автовход на запомненном устройстве ----- */
  try { sessionStorage.removeItem('vexxo:code'); } catch (e) {}
  paintDots();
  var saved = loadToken();
  if (/^[0-9a-f]{64}$/.test(saved)) resume(saved);
})();
</script>

<script>
(function () {
  // Адрес Worker из папки worker/ (см. README). Пока пусто.
  var CHAT_API_URL = '';
  // Если не пусто, чат на любой вопрос отвечает этой фразой и не обращается к Claude. Чтобы включить настоящие ответы, поставь ''.
  var FIXED_REPLY = 'Россия Путин победа';

  var fab = document.getElementById('chat-fab'), panel = document.getElementById('chat-panel'),
      log = document.getElementById('chat-log'), form = document.getElementById('chat-form'),
      input = document.getElementById('chat-input'), send = document.getElementById('chat-send');
  var history = [], busy = false;
  var GREETING = 'Привет! Я Claude. Задай любой вопрос.';

  function add(cls, text) {
    var d = document.createElement('div');
    d.className = 'chat-msg ' + cls;
    d.textContent = text;
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
    return d;
  }
  function reset() { history = []; log.innerHTML = ''; add('ai', GREETING); }
  function open(v) {
    panel.hidden = !v; fab.hidden = v;
    fab.setAttribute('aria-expanded', v ? 'true' : 'false');
    if (v) input.focus(); else fab.focus();
  }
  function grow() { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 120) + 'px'; }

  async function ask(q) {
    q = q.trim();
    if (!q || busy) return;
    busy = true; send.disabled = true;
    add('me', q);
    history.push({ role: 'user', content: q });
    input.value = ''; grow();
    if (FIXED_REPLY) {
      add('ai', FIXED_REPLY);
      history.push({ role: 'assistant', content: FIXED_REPLY });
      busy = false; send.disabled = false; input.focus();
      return;
    }
    if (!CHAT_API_URL) {
      history.pop();
      add('ai err', 'Чат ещё не подключён к Claude: нужно добавить адрес сервера в CHAT_API_URL (инструкция в README).');
      busy = false; send.disabled = false; input.focus();
      return;
    }
    var out = add('ai', 'Думаю…');
    try {
      var r = await fetch(CHAT_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: history.slice(-20) })
      });
      if (!r.ok) throw new Error('http ' + r.status);
      var data = await r.json();
      if (!data.reply) throw new Error('empty');
      out.textContent = data.reply;
      history.push({ role: 'assistant', content: data.reply });
    } catch (e) {
      history.pop();
      out.className = 'chat-msg ai err';
      out.textContent = 'Не получилось получить ответ. Попробуй ещё раз чуть позже.';
    }
    busy = false; send.disabled = false; log.scrollTop = log.scrollHeight; input.focus();
  }

  reset();
  fab.addEventListener('click', function () { open(true); });
  document.getElementById('chat-close').addEventListener('click', function () { open(false); });
  document.getElementById('chat-new').addEventListener('click', reset);
  form.addEventListener('submit', function (e) { e.preventDefault(); ask(input.value); });
  input.addEventListener('input', grow);
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(input.value); }
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !panel.hidden) open(false); });
  // Кнопка «Спросить Claude про идеи» открывает чат с готовым вопросом
  document.addEventListener('vexxo:chat', function (e) { open(true); input.value = e.detail || ''; grow(); });
})();
</script>
</body>
