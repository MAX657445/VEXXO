<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VEXXO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500;700&display=swap">
<style>
/* Layout: экран входа по коду, затем шапка с логотипом и переключателем «Уля / Максим», под ней страница человека блоками. Чат Claude плавает справа внизу. */
:root {
  --bg: #EEF1F6;
  --surface: #FFFFFF;
  --ink: #0E1424;
  --muted: #5B6680;
  --line: #D7DDEA;
  --accent: #FF5A36;
  --on-accent: #FFFFFF;
  --accent2: #2B5CFF;
  --tint: #E4E9F4;
  --glow1: rgba(255, 90, 54, 0.16);
  --glow2: rgba(43, 92, 255, 0.14);
  --font-display: "Unbounded", "Onest", system-ui, sans-serif;
  --font-sans: "Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #090C14;
    --surface: #121827;
    --ink: #EAEFFA;
    --muted: #8E99B3;
    --line: #232B40;
    --accent: #FF7A59;
    --on-accent: #1A0A05;
    --accent2: #7C97FF;
    --tint: #1A2236;
    --glow1: rgba(255, 122, 89, 0.20);
    --glow2: rgba(124, 151, 255, 0.18);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #090C14;
  --surface: #121827;
  --ink: #EAEFFA;
  --muted: #8E99B3;
  --line: #232B40;
  --accent: #FF7A59;
  --on-accent: #1A0A05;
  --accent2: #7C97FF;
  --tint: #1A2236;
  --glow1: rgba(255, 122, 89, 0.20);
  --glow2: rgba(124, 151, 255, 0.18);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(60rem 36rem at 90% -10%, var(--glow1), transparent 60%),
    radial-gradient(50rem 32rem at -10% 10%, var(--glow2), transparent 60%),
    var(--bg);
  background-attachment: fixed;
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 16px;
  line-height: 1.55;
  padding-block: max(20px, env(safe-area-inset-top, 0px)) 96px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button { font: inherit; color: inherit; }
button:focus-visible, a:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- Экран входа ---------- */
.lock { min-height: calc(100vh - 120px); display: grid; place-items: center; }
.lock-card {
  width: min(360px, 100%);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 24px;
  padding: 32px 24px 24px;
  text-align: center;
  display: flex; flex-direction: column; gap: 20px;
}
.logo { font-family: var(--font-display); font-weight: 700; letter-spacing: 0.04em; }
.lock .logo { font-size: 30px; }
.lock p { margin: 0; color: var(--muted); font-size: 15px; }
.dots { display: flex; justify-content: center; gap: 14px; height: 18px; }
.dots i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); transition: background-color .12s, border-color .12s; }
.dots i.on { background: var(--accent); border-color: var(--accent); }
.dots.bad { animation: shake .35s; }
.dots.bad i { border-color: var(--accent); }
@keyframes shake { 20%, 60% { transform: translateX(-7px); } 40%, 80% { transform: translateX(7px); } }
.keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.keys button {
  height: 56px; border-radius: 16px; border: 1px solid var(--line);
  background: var(--bg); font-size: 22px; font-weight: 500; cursor: pointer;
  transition: background-color .12s, border-color .12s;
}
.keys button:hover { border-color: var(--accent); }
.keys button:active { background: var(--tint); }
.keys .blank { visibility: hidden; }
.hint { font-size: 13px; }

/* ---------- Каркас сайта ---------- */
.app { max-width: 880px; margin-inline: auto; display: flex; flex-direction: column; gap: 28px; min-width: 0; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.top .logo { font-size: 20px; }
.tabs { display: inline-flex; padding: 4px; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; }
.tabs button { border: none; background: none; cursor: pointer; padding: 9px 20px; border-radius: 999px; font-weight: 500; color: var(--muted); transition: background-color .15s, color .15s; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] { background: var(--accent); color: var(--on-accent); font-weight: 700; }
.exit { border: 1px solid var(--line); background: none; border-radius: 999px; padding: 9px 16px; color: var(--muted); cursor: pointer; font-size: 14px; }
.exit:hover { color: var(--ink); border-color: var(--ink); }

.draft {
  align-self: flex-start; font-size: 13px; color: var(--muted);
  border: 1px dashed var(--line); border-radius: 999px; padding: 4px 12px;
}

/* ---------- Страница человека ---------- */
.panel { display: flex; flex-direction: column; gap: 36px; min-width: 0; }
.hero { display: flex; flex-direction: column; gap: 16px; padding-top: 8px; }
.eyebrow { margin: 0; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); font-weight: 700; }
h1 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: clamp(44px, 12vw, 88px); line-height: 1; letter-spacing: -0.03em; text-wrap: balance; }
.lead { margin: 0; max-width: 34em; font-size: clamp(17px, 2.4vw, 20px); color: var(--muted); }
.cta { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 12px 22px; font-weight: 500; cursor: pointer; text-decoration: none; color: var(--ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 700; }
.btn:hover { border-color: var(--accent); }

.block { display: flex; flex-direction: column; gap: 16px; }
.block h2 { margin: 0; font-family: var(--font-display); font-weight: 500; font-size: 22px; letter-spacing: -0.01em; }
.block p { margin: 0; max-width: 44em; color: var(--muted); }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card .tag { font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent2); font-weight: 700; }
.card h3 { margin: 0; font-size: 19px; line-height: 1.25; }
.card p { font-size: 15px; }
.notes { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; }
.notes li { display: grid; grid-template-columns: 5.5rem minmax(0, 1fr); gap: 12px; padding: 14px 18px; }
.notes li + li { border-top: 1px solid var(--line); }
.notes time { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.notes span { overflow-wrap: anywhere; }
.foot { color: var(--muted); font-size: 13px; padding-top: 8px; }

/* ---------- Чат с Claude ---------- */
.chat-fab {
  position: fixed; z-index: 20;
  right: max(16px, env(safe-area-inset-right, 0px));
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  font-weight: 700; font-size: 15px;
  background: var(--accent); color: var(--on-accent);
  border: none; border-radius: 999px; padding: 13px 20px; cursor: pointer;
  box-shadow: 0 6px 24px rgba(0, 0, 0, 0.28);
}
.chat-fab[hidden], .chat-panel[hidden] { display: none; }
.chat-panel button:focus-visible, .chat-panel textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.chat-panel {
  position: fixed; z-index: 30;
  right: max(16px, env(safe-area-inset-right, 0px));
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  width: min(400px, calc(100vw - 32px));
  height: min(560px, calc(100% - 32px - env(safe-area-inset-bottom, 0px)));
  display: flex; flex-direction: column; min-width: 0;
  background: var(--surface); color: var(--ink);
  border: 1px solid var(--line); border-radius: 20px; overflow: hidden;
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
}
.chat-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.chat-head strong { font-size: 16px; }
.chat-head button { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 8px; padding: 4px 10px; cursor: pointer; }
.chat-log { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 14px; }
.chat-msg { max-width: 88%; padding: 9px 12px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 15px; }
.chat-msg.ai { align-self: flex-start; background: var(--tint); border-bottom-left-radius: 4px; }
.chat-msg.me { align-self: flex-end; background: var(--accent); color: var(--on-accent); border-bottom-right-radius: 4px; }
.chat-msg.err { color: var(--muted); font-style: italic; }
.chat-form { display: flex; gap: 8px; align-items: flex-end; padding: 10px 12px; border-top: 1px solid var(--line); }
.chat-form textarea { flex: 1; min-width: 0; resize: none; max-height: 120px; font: inherit; font-size: 15px; line-height: 1.4; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; }
.chat-form button { font-weight: 700; background: var(--accent); color: var(--on-accent); border: none; border-radius: 12px; padding: 9px 14px; cursor: pointer; }
.chat-form button:disabled { opacity: 0.5; cursor: default; }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<!-- Вход по коду -->
<div class="lock" id="lock">
  <div class="lock-card">
    <div class="logo">VEXXO</div>
    <p>Введи код, чтобы войти</p>
    <div class="dots" id="dots" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <div class="keys" id="keys" role="group" aria-label="Цифровая клавиатура">
      <button type="button" data-k="1">1</button><button type="button" data-k="2">2</button><button type="button" data-k="3">3</button>
      <button type="button" data-k="4">4</button><button type="button" data-k="5">5</button><button type="button" data-k="6">6</button>
      <button type="button" data-k="7">7</button><button type="button" data-k="8">8</button><button type="button" data-k="9">9</button>
      <button type="button" class="blank" tabindex="-1" aria-hidden="true">0</button>
      <button type="button" data-k="0">0</button>
      <button type="button" data-k="back" aria-label="Стереть">⌫</button>
    </div>
    <p class="hint" id="hint" aria-live="polite">Код пока временный</p>
  </div>
</div>

<!-- Сайт -->
<div class="app" id="app" hidden>
  <header class="top">
    <div class="logo">VEXXO</div>
    <div class="tabs" role="tablist" aria-label="Страницы">
      <button type="button" role="tab" id="tab-ulya" data-p="ulya" aria-selected="true">Уля</button>
      <button type="button" role="tab" id="tab-maxim" data-p="maxim" aria-selected="false">Максим</button>
    </div>
    <button type="button" class="exit" id="exit">Выйти</button>
  </header>
  <p class="draft">Набросок. Весь текст здесь временный, нужен чтобы увидеть структуру.</p>
  <main class="panel" id="panel" role="tabpanel" aria-live="polite"></main>
  <p class="foot">VEXXO · черновая версия</p>
</div>

<!-- Чат -->
<button type="button" class="chat-fab" id="chat-fab" hidden aria-controls="chat-panel" aria-expanded="false">Спросить Claude</button>
<section class="chat-panel" id="chat-panel" hidden aria-label="Чат с Claude">
  <div class="chat-head"><strong>Чат с Claude</strong><span><button type="button" id="chat-new">Новый</button> <button type="button" id="chat-close" aria-label="Закрыть чат">✕</button></span></div>
  <div class="chat-log" id="chat-log" aria-live="polite"></div>
  <form class="chat-form" id="chat-form">
    <textarea id="chat-input" rows="1" maxlength="2000" placeholder="Напиши вопрос…" aria-label="Вопрос"></textarea>
    <button type="submit" id="chat-send">Отправить</button>
  </form>
</section>

<script>
(function () {
  // Код входа. Это защита только от случайных гостей: код виден в исходнике страницы.
  var PIN = '1111';
  var SKEY = 'vexxo:unlocked';

  // Текст-рыба. Потом заменим настоящим содержанием.
  var PEOPLE = {
    ulya: {
      name: 'Уля',
      eyebrow: 'Страница · 01',
      lead: 'Здесь будет короткая фраза про Улю: чем занимается, что любит и что важно показать в первую очередь.',
      about: 'Lorem ipsum заменим на живой текст. Сюда пойдёт рассказ о себе в три-четыре предложения: откуда она, чему учится, какие у неё планы и интересы. Блок можно сделать длиннее или убрать совсем.',
      projects: [
        { tag: 'Учёба', title: 'Проект номер один', text: 'Коротко о том, что это за проект и зачем он нужен.' },
        { tag: 'Дело', title: 'Проект номер два', text: 'Одна-две строки описания. Позже добавим ссылку или фото.' },
        { tag: 'Идея', title: 'Проект номер три', text: 'Место под ещё одну работу или задумку.' }
      ],
      notes: [
        ['00.00', 'Первая заметка. Сюда можно писать новости и планы.'],
        ['00.00', 'Вторая заметка, чуть длиннее, чтобы было видно, как переносится текст на узком экране.'],
        ['00.00', 'Третья заметка.']
      ]
    },
    maxim: {
      name: 'Максим',
      eyebrow: 'Страница · 02',
      lead: 'Здесь будет короткая фраза про Максима: кто он, чем занят и чем может быть полезен.',
      about: 'Lorem ipsum заменим на живой текст. Тут будет рассказ о себе: учёба, увлечения, проекты, чем хочется заниматься дальше. Структура такая же, как у Ули, но содержание своё.',
      projects: [
        { tag: 'Чертежи', title: 'Проект номер один', text: 'Коротко о проекте: что сделано и что получилось.' },
        { tag: 'Дом', title: 'Проект номер два', text: 'Одна-две строки описания. Позже добавим ссылку или картинку.' },
        { tag: 'Идея', title: 'Проект номер три', text: 'Место под ещё одну работу или задумку.' }
      ],
      notes: [
        ['00.00', 'Первая заметка. Сюда можно писать новости и планы.'],
        ['00.00', 'Вторая заметка, чуть длиннее, чтобы было видно, как переносится текст на узком экране.'],
        ['00.00', 'Третья заметка.']
      ]
    }
  };

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function $(id) { return document.getElementById(id); }

  /* ----- вход ----- */
  var entered = '';
  var lock = $('lock'), app = $('app'), dots = $('dots'), hint = $('hint'), fab = $('chat-fab');

  function paintDots() {
    var d = dots.children;
    for (var i = 0; i < d.length; i++) d[i].className = i < entered.length ? 'on' : '';
  }
  function unlock(remember) {
    lock.hidden = true; app.hidden = false; fab.hidden = false;
    if (remember) { try { sessionStorage.setItem(SKEY, '1'); } catch (e) {} }
    show(fromHash() || 'ulya');
  }
  function press(k) {
    if (k === 'back') entered = entered.slice(0, -1);
    else if (entered.length < 4) entered += k;
    paintDots();
    if (entered.length === 4) {
      if (entered === PIN) { entered = ''; unlock(true); }
      else {
        hint.textContent = 'Неверный код, попробуй ещё раз';
        dots.classList.remove('bad'); void dots.offsetWidth; dots.classList.add('bad');
        setTimeout(function () { entered = ''; paintDots(); }, 350);
      }
    }
  }
  $('keys').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-k]');
    if (b) press(b.getAttribute('data-k'));
  });
  document.addEventListener('keydown', function (e) {
    if (lock.hidden) return;
    if (/^[0-9]$/.test(e.key)) press(e.key);
    else if (e.key === 'Backspace') press('back');
  });
  $('exit').addEventListener('click', function () {
    try { sessionStorage.removeItem(SKEY); } catch (e) {}
    app.hidden = true; lock.hidden = false; fab.hidden = true; $('chat-panel').hidden = true;
    entered = ''; paintDots(); hint.textContent = 'Код пока временный';
  });

  /* ----- вкладки ----- */
  function fromHash() {
    var h = (location.hash || '').replace('#', '');
    return PEOPLE[h] ? h : '';
  }
  function show(key) {
    var p = PEOPLE[key];
    ['ulya', 'maxim'].forEach(function (k) { $('tab-' + k).setAttribute('aria-selected', k === key ? 'true' : 'false'); });
    var html = '<section class="hero"><p class="eyebrow">' + esc(p.eyebrow) + '</p><h1>' + esc(p.name) + '</h1><p class="lead">' + esc(p.lead) + '</p>' +
      '<div class="cta"><button type="button" class="btn primary">Главная кнопка</button><button type="button" class="btn">Вторая кнопка</button></div></section>' +
      '<section class="block"><h2>Обо мне</h2><p>' + esc(p.about) + '</p></section>' +
      '<section class="block"><h2>Проекты</h2><div class="cards">' +
      p.projects.map(function (c) { return '<article class="card"><span class="tag">' + esc(c.tag) + '</span><h3>' + esc(c.title) + '</h3><p>' + esc(c.text) + '</p></article>'; }).join('') +
      '</div></section>' +
      '<section class="block"><h2>Заметки</h2><ul class="notes">' +
      p.notes.map(function (n) { return '<li><time>' + esc(n[0]) + '</time><span>' + esc(n[1]) + '</span></li>'; }).join('') +
      '</ul></section>';
    $('panel').innerHTML = html;
    try { history.replaceState(null, '', '#' + key); } catch (e) {}
  }
  document.querySelector('.tabs').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-p]');
    if (b) show(b.getAttribute('data-p'));
  });

  var ok = false;
  try { ok = sessionStorage.getItem(SKEY) === '1'; } catch (e) {}
  if (ok) unlock(false);
})();
</script>

<script>
(function () {
  // Адрес Worker из папки worker/ (см. README). Пока пусто.
  var CHAT_API_URL = '';
  // Если не пусто, чат на любой вопрос отвечает этой фразой и не обращается к Claude. Чтобы включить настоящие ответы, поставь ''.
  var FIXED_REPLY = 'Россия Путин победа';

  var fab = document.getElementById('chat-fab'), panel = document.getElementById('chat-panel'),
      log = document.getElementById('chat-log'), form = document.getElementById('chat-form'),
      input = document.getElementById('chat-input'), send = document.getElementById('chat-send');
  var history = [], busy = false;
  var GREETING = 'Привет! Я Claude. Задай любой вопрос.';

  function add(cls, text) {
    var d = document.createElement('div');
    d.className = 'chat-msg ' + cls;
    d.textContent = text;
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
    return d;
  }
  function reset() { history = []; log.innerHTML = ''; add('ai', GREETING); }
  function open(v) {
    panel.hidden = !v; fab.hidden = v;
    fab.setAttribute('aria-expanded', v ? 'true' : 'false');
    if (v) input.focus(); else fab.focus();
  }
  function grow() { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 120) + 'px'; }

  async function ask(q) {
    q = q.trim();
    if (!q || busy) return;
    busy = true; send.disabled = true;
    add('me', q);
    history.push({ role: 'user', content: q });
    input.value = ''; grow();
    if (FIXED_REPLY) {
      add('ai', FIXED_REPLY);
      history.push({ role: 'assistant', content: FIXED_REPLY });
      busy = false; send.disabled = false; input.focus();
      return;
    }
    if (!CHAT_API_URL) {
      history.pop();
      add('ai err', 'Чат ещё не подключён к Claude: нужно добавить адрес сервера в CHAT_API_URL (инструкция в README).');
      busy = false; send.disabled = false; input.focus();
      return;
    }
    var out = add('ai', 'Думаю…');
    try {
      var r = await fetch(CHAT_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: history.slice(-20) })
      });
      if (!r.ok) throw new Error('http ' + r.status);
      var data = await r.json();
      if (!data.reply) throw new Error('empty');
      out.textContent = data.reply;
      history.push({ role: 'assistant', content: data.reply });
    } catch (e) {
      history.pop();
      out.className = 'chat-msg ai err';
      out.textContent = 'Не получилось получить ответ. Попробуй ещё раз чуть позже.';
    }
    busy = false; send.disabled = false; log.scrollTop = log.scrollHeight; input.focus();
  }

  reset();
  fab.addEventListener('click', function () { open(true); });
  document.getElementById('chat-close').addEventListener('click', function () { open(false); });
  document.getElementById('chat-new').addEventListener('click', reset);
  form.addEventListener('submit', function (e) { e.preventDefault(); ask(input.value); });
  input.addEventListener('input', grow);
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(input.value); }
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !panel.hidden) open(false); });
})();
</script>
</body>
</html>
